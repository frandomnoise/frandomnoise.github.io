.scale-f { font-size: 0.75rem; color: var(--ink-3); margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { padding: 8px 12px; border: 1px solid var(--rule); border-radius: var(--radius); }
.tile-k { font-size: 0.78rem; color: var(--ink-2); }
.tile-v { font: 600 1.45rem/1.3 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.tile-v small { font-size: 0.8rem; font-weight: 400; color: var(--ink-2); }

.map-wrap { position: relative; }

.key-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -2px; }
.key-ramp { display: inline-block; width: 90px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--fo-lo), var(--fo-hi)); }

</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <a class="logo" href="#blog" aria-label="frandomnoise home">
      <svg class="logo-mark" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M2 18 L7 12 L10 21 L13 7 L16 25 L19 11 L22 19 L25 14 L30 17" fill="none" stroke="var(--logo-random)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg><span class="l-f">f</span><span class="l-random">random</span><span class="l-noise">noise</span>
    </a>
    <nav class="main" aria-label="Sections">
      <a href="#blog" data-route="blog">Blog</a>

      <a href="#satellites" data-route="satellites">Satellites</a>
      <a href="#propagation" data-route="propagation">Propagation</a>
      <a href="#websdr" data-route="websdr">WebSDR</a>
      <a href="https://gnuradioworld.com/" class="ext" target="_blank" rel="noopener">GNU Radio World</a>
    </nav>
    <span class="spacer"></span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">◐ theme</button>
  </div>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<footer class="bottom">
  <div class="wrap">
    <span><span class="logo" style="font-size:0.9rem"><span class="l-f">f</span><span class="l-random">random</span><span class="l-noise">noise</span></span></span>
  </div>
</footer>

<script>
'use strict';

/* ============================================================
   Utilities
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const h = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const log10 = Math.log10;
const C0 = 299792458;            // m/s
const K_B = 1.380649e-23;        // J/K
const DEG = Math.PI / 180;

function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) { return null; }
}

function fmt(x, digits = 2) {
  if (!Number.isFinite(x)) return '-';
  const a = Math.abs(x);
  if (a !== 0 && (a >= 1e6 || a < 1e-3)) return x.toExponential(digits);
  return x.toFixed(digits);
}

function fmtSI(x, unit, digits = 3) {
  if (!Number.isFinite(x)) return '-';
  const p = [['T', 1e12], ['G', 1e9], ['M', 1e6], ['k', 1e3], ['', 1], ['m', 1e-3], ['µ', 1e-6], ['n', 1e-9], ['p', 1e-12], ['f', 1e-15]];
  const a = Math.abs(x);
  for (const [s, v] of p) if (a >= v) return `${(x / v).toPrecision(digits)} ${s}${unit}`;
  return `${x.toExponential(digits - 1)} ${unit}`;
}

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}

/* ============================================================
   Theme
   ============================================================ */
(function theme() {
  const btn = $('#themeBtn');
  const label = () => {
    const t = document.documentElement.dataset.theme;
    btn.textContent = t === 'dark' ? '☾ dark' : t === 'light' ? '☀ light' : '◐ auto';
  };
  btn.addEventListener('click', () => {
    const order = [undefined, 'light', 'dark'];
    const cur = document.documentElement.dataset.theme;
    const next = order[(order.indexOf(cur) + 1) % order.length];
    if (next) document.documentElement.dataset.theme = next;
    else delete document.documentElement.dataset.theme;
    try { next ? localStorage.setItem('fn-theme', next) : localStorage.removeItem('fn-theme'); } catch (e) {}
    label();
  });
  label();
})();

/* ============================================================
   Router (hash based)
   ============================================================ */
const routes = {};
let cleanup = null;

function route(name, render) { routes[name] = render; }

async function navigate() {
  // #route?key=value: the query part is passed to the page as URLSearchParams.
  const raw = location.hash.slice(1), qi = raw.indexOf('?');
  const hash = decodeURIComponent(qi < 0 ? raw : raw.slice(0, qi)) || 'blog';
  const params = new URLSearchParams(qi < 0 ? '' : raw.slice(qi + 1));
  let name = hash, param = null;
  if (hash.startsWith('post-')) { name = 'post'; param = hash.slice(5); }
  const render = routes[name] || routes.notfound;
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  document.querySelectorAll('nav.main a[data-route]').forEach(a => {
    const active = a.dataset.route === (name === 'post' ? 'blog' : name);
    active ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
  // Fresh <main> per route so listeners attached by a page die with it.
  const old = $('#view');
  const view = old.cloneNode(false);
  old.replaceWith(view);
  cleanup = (await render(view, param, params)) || null;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', navigate);

route('notfound', view => {
  view.innerHTML = `<div class="page-head"><span class="label">404</span><h1>No carrier</h1>
    <p>Nothing on this frequency. Back to the <a href="#blog">blog</a>.</p></div>`;
  document.title = 'Not found - frandomnoise';
});

/* ============================================================
   Blog
   ============================================================ */
let postsCache = null;
async function getPosts() {
  if (!postsCache) postsCache = await fetchJSON('posts.json');
  return postsCache;
}

route('blog', async view => {
  document.title = 'frandomnoise - SDR notebook';
  view.innerHTML = `<div class="page-head"><span class="label">Log book</span><h1>Blog</h1>
    <p>Notes on software defined radio, signal processing and the RF spectrum.</p></div>
    <div class="tags" id="tagbar" style="margin-bottom:16px"></div>
    <div class="post-list" id="posts"><p class="muted">Loading…</p></div>`;
  let posts;
  try { posts = await getPosts(); }
  catch (e) {
    $('#posts').innerHTML = `<div class="notice">Could not load <code>posts.json</code>. Run <code>node scripts/build.mjs --serve</code> and open the built site.</div>`;
    return;
  }
  const tags = [...new Set(posts.flatMap(p => p.tags))].sort();
  let active = null;
  const bar = $('#tagbar');
  const draw = () => {
    bar.innerHTML = tags.map(t => `<button class="tag" type="button" aria-pressed="${t === active}" data-tag="${h(t)}">#${h(t)}</button>`).join('');
    const list = active ? posts.filter(p => p.tags.includes(active)) : posts;
    $('#posts').innerHTML = list.length ? list.map(p => `
      <a class="panel post-card" href="#post-${h(p.slug)}">
        <div class="meta"><span>${h(p.date)}</span><span>${p.readingMinutes} min</span>${p.status === 'draft' ? '<span class="draft-badge">DRAFT</span>' : ''}</div>
        <h2>${h(p.title)}</h2>
        <p>${h(p.summary)}</p>
        <div class="tags">${p.tags.map(t => `<span class="tag">#${h(t)}</span>`).join('')}</div>
      </a>`).join('') : '<p class="muted">No posts yet.</p>';
  };
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-tag]');
    if (!b) return;
    active = active === b.dataset.tag ? null : b.dataset.tag;
    draw();
  });
  draw();
});

route('post', async (view, slug) => {
  let posts;
  try { posts = await getPosts(); } catch (e) { posts = []; }
  const p = posts.find(x => x.slug === slug);
  if (!p) return routes.notfound(view);
  document.title = `${p.title} - frandomnoise`;
  view.innerHTML = `<article class="post">
    <a href="#blog" class="small mono">← blog</a>
    <h1>${h(p.title)}</h1>
    <div class="meta"><span>${h(p.date)}</span><span>${p.readingMinutes} min read</span>${p.status === 'draft' ? '<span class="draft-badge">DRAFT</span>' : ''}</div>
    <div class="tags">${p.tags.map(t => `<span class="tag">#${h(t)}</span>`).join('')}</div>
    <div class="body">${p.html}</div>
  </article>`;
});

/* ============================================================
   RF Calculators
   Each calculator: inputs -> compute() -> rows [{k, v, warn?}]
   ============================================================ */
const calculators = [
  {
    id: 'fspl',
    title: 'Free-space path loss',
    inputs: [
      { id: 'f', label: 'Frequency', unit: 'MHz', value: 145.8 },
      { id: 'd', label: 'Distance', unit: 'km', value: 1000 },
    ],
    compute: ({ f, d }) => {
      const L = 32.45 + 20 * log10(f) + 20 * log10(d);
      const lambda = C0 / (f * 1e6);
      return [
        { k: 'L_bf', v: `${fmt(L)} dB` },
        { k: 'λ', v: fmtSI(lambda, 'm') },
      ];
    },
    model: '<b>ITU-R P.525-4</b>: L<sub>bf</sub> = 32.45 + 20·log f<sub>MHz</sub> + 20·log d<sub>km</sub> (isotropic antennas). Valid only in the far field and for an unobstructed path. No atmospheric, multipath or diffraction losses.',
  },
  {
    id: 'noise',
    title: 'Thermal noise floor & sensitivity',
    inputs: [
      { id: 'B', label: 'Noise bandwidth', unit: 'Hz', value: 12500 },
      { id: 'NF', label: 'Noise figure', unit: 'dB', value: 6 },
      { id: 'snr', label: 'Required SNR', unit: 'dB', value: 10 },
      { id: 'T0', label: 'Reference temperature', unit: 'K', value: 290 },
    ],
    compute: ({ B, NF, snr, T0 }) => {
      const kT = 10 * log10(K_B * T0 * 1e3);           // dBm/Hz
      const N = kT + 10 * log10(B) + NF;
      const Te = T0 * (10 ** (NF / 10) - 1);
      return [
        { k: 'kT₀', v: `${fmt(kT)} dBm/Hz` },
        { k: 'Noise floor N', v: `${fmt(N)} dBm` },
        { k: 'Sensitivity (N + SNR)', v: `${fmt(N + snr)} dBm` },
        { k: 'T_e of receiver', v: `${fmt(Te, 1)} K` },
      ];
    },
    model: '<b>Johnson-Nyquist</b>: N = 10·log(kT<sub>0</sub>B) + NF, with T<sub>0</sub> = 290 K (IEEE standard reference). Assumes the antenna noise temperature equals T<sub>0</sub>. At HF the external (galactic/man-made) noise usually dominates, see <b>ITU-R P.372</b>. B is the equivalent noise bandwidth, not the -3 dB bandwidth.',
  },
  {
    id: 'friis-nf',
    title: 'Cascaded noise figure',
    inputs: [
      { id: 'g1', label: 'Stage 1 gain', unit: 'dB', value: 20 },
      { id: 'n1', label: 'Stage 1 NF', unit: 'dB', value: 0.8 },
      { id: 'g2', label: 'Stage 2 gain', unit: 'dB', value: -3 },
      { id: 'n2', label: 'Stage 2 NF', unit: 'dB', value: 3 },
      { id: 'g3', label: 'Stage 3 gain', unit: 'dB', value: 30 },
      { id: 'n3', label: 'Stage 3 NF', unit: 'dB', value: 6 },
    ],
    compute: ({ g1, n1, g2, n2, g3, n3 }) => {
      const lin = x => 10 ** (x / 10);
      const F = lin(n1) + (lin(n2) - 1) / lin(g1) + (lin(n3) - 1) / (lin(g1) * lin(g2));
      return [
        { k: 'NF total', v: `${fmt(10 * log10(F), 3)} dB` },
        { k: 'Gain total', v: `${fmt(g1 + g2 + g3)} dB` },
        { k: 'T_e total', v: `${fmt(290 * (F - 1), 1)} K` },
      ];
    },
    model: '<b>Friis (1944)</b>: F = F<sub>1</sub> + (F<sub>2</sub>-1)/G<sub>1</sub> + (F<sub>3</sub>-1)/(G<sub>1</sub>G<sub>2</sub>). Available power gains, matched interfaces. For a passive lossy stage at 290 K, NF = loss.',
  },
  {
    id: 'power',
    title: 'Power & level conversion (50 Ω)',
    inputs: [
      { id: 'p', label: 'Power', unit: 'dBm', value: -73 },
      { id: 'z', label: 'Impedance', unit: 'Ω', value: 50 },
    ],
    compute: ({ p, z }) => {
      const W = 10 ** ((p - 30) / 10);
      const V = Math.sqrt(W * z);
      return [
        { k: 'Power', v: fmtSI(W, 'W') },
        { k: 'dBW', v: `${fmt(p - 30)} dBW` },
        { k: 'V_rms', v: fmtSI(V, 'V') },
        { k: 'dBµV', v: `${fmt(20 * log10(V * 1e6))} dBµV` },
        { k: 'V_pp (sine)', v: fmtSI(V * 2 * Math.SQRT2, 'V') },
      ];
    },
    model: 'P = V<sub>rms</sub>²/R. dBµV = dBm + 10·log(R·10<sup>9</sup>) → +107 dB at 50 Ω. (-73 dBm ≈ S9 on HF per IARU Region 1 Technical Recommendation R.1.)',
  },
  {
    id: 'vswr',
    title: 'Mismatch: VSWR / Γ / return loss',
    inputs: [{ id: 's', label: 'VSWR', unit: ':1', value: 1.5 }],
    compute: ({ s }) => {
      if (s < 1) return [{ k: 'Error', v: 'VSWR ≥ 1', warn: true }];
      const g = (s - 1) / (s + 1);
      return [
        { k: '|Γ|', v: fmt(g, 4) },
        { k: 'Return loss', v: s === 1 ? '∞' : `${fmt(-20 * log10(g))} dB` },
        { k: 'Mismatch loss', v: `${fmt(-10 * log10(1 - g * g), 3)} dB` },
        { k: 'Reflected power', v: `${fmt(100 * g * g)} %` },
      ];
    },
    model: '|Γ| = (S-1)/(S+1), RL = -20·log|Γ|, ML = -10·log(1-|Γ|²). Lossless line. Line loss improves the VSWR seen at the transmitter.',
  },
  {
    id: 'wave',
    title: 'Wavelength & dipole length',
    inputs: [
      { id: 'f', label: 'Frequency', unit: 'MHz', value: 145 },
      { id: 'vf', label: 'Velocity / shortening factor', unit: '', value: 0.95 },
    ],
    compute: ({ f, vf }) => {
      const l = C0 / (f * 1e6);
      return [
        { k: 'λ (free space)', v: fmtSI(l, 'm') },
        { k: 'λ/2 × k', v: fmtSI(l / 2 * vf, 'm') },
        { k: 'λ/4 × k', v: fmtSI(l / 4 * vf, 'm') },
      ];
    },
    model: 'λ = c/f. The end-effect shortening factor k ≈ 0.95-0.98 for wire dipoles depends on the length/diameter ratio, trim on the antenna. For coax stubs use the cable velocity factor instead.',
  },
  {
    id: 'hata',
    title: 'Okumura-Hata / COST-231 Hata',
    inputs: [
      { id: 'model', label: 'Model / environment', type: 'select', value: 'hata-urban-small', options: [
        ['hata-urban-small', 'Hata, urban (small/medium city)'],
        ['hata-urban-large', 'Hata, urban (large city)'],
        ['hata-suburban', 'Hata, suburban'],
        ['hata-open', 'Hata, open/rural'],
        ['cost-medium', 'COST-231, medium city / suburban'],
        ['cost-metro', 'COST-231, metropolitan centre'],
      ] },
      { id: 'f', label: 'Frequency', unit: 'MHz', value: 900 },
      { id: 'hb', label: 'Base station height', unit: 'm', value: 30 },
      { id: 'hm', label: 'Mobile height', unit: 'm', value: 1.5 },
      { id: 'd', label: 'Distance', unit: 'km', value: 5 },
    ],
    compute: ({ model, f, hb, hm, d }) => {
      const lf = log10(f), lhb = log10(hb), ld = log10(d);
      const isCost = model.startsWith('cost');
      const large = model === 'hata-urban-large' || model === 'cost-metro';
      let a;
      if (large) a = f <= 300 ? 8.29 * log10(1.54 * hm) ** 2 - 1.1 : 3.2 * log10(11.75 * hm) ** 2 - 4.97;
      else a = (1.1 * lf - 0.7) * hm - (1.56 * lf - 0.8);
      let L;
      if (isCost) {
        L = 46.3 + 33.9 * lf - 13.82 * lhb - a + (44.9 - 6.55 * lhb) * ld + (model === 'cost-metro' ? 3 : 0);
      } else {
        L = 69.55 + 26.16 * lf - 13.82 * lhb - a + (44.9 - 6.55 * lhb) * ld;
        if (model === 'hata-suburban') L -= 2 * log10(f / 28) ** 2 + 5.4;
        if (model === 'hata-open') L -= 4.78 * lf ** 2 - 18.33 * lf + 40.94;
      }
      const warns = [];
      const [fmin, fmax] = isCost ? [1500, 2000] : [150, 1500];
      if (f < fmin || f > fmax) warns.push(`f outside ${fmin}-${fmax} MHz`);
      if (hb < 30 || hb > 200) warns.push('h_b outside 30-200 m');
      if (hm < 1 || hm > 10) warns.push('h_m outside 1-10 m');
      if (d < 1 || d > 20) warns.push('d outside 1-20 km');
      const fs = 32.45 + 20 * lf + 20 * ld;
      return [
        { k: 'Median path loss', v: `${fmt(L)} dB` },
        { k: 'Excess over free space', v: `${fmt(L - fs)} dB` },
        ...warns.map(w => ({ k: 'Out of range', v: w, warn: true })),
      ];
    },
    model: '<b>Hata (1980)</b>, empirical fit to Okumura: 150-1500 MHz, h<sub>b</sub> 30-200 m, h<sub>m</sub> 1-10 m, d 1-20 km. Large-city a(h<sub>m</sub>) uses the f ≤ 200 MHz form below 300 MHz here. <b>COST-231 Hata</b> (COST Action 231 final report, 1999): 1500-2000 MHz, same h/d ranges, C<sub>m</sub> = 0/3 dB. Median loss only, base antenna above surrounding rooftops. No terrain, no location variability.',
  },
  {
    id: 'link',
    title: 'Link budget (free space)',
    inputs: [
      { id: 'pt', label: 'TX power', unit: 'dBm', value: 37 },
      { id: 'gt', label: 'TX antenna gain', unit: 'dBi', value: 2.15 },
      { id: 'gr', label: 'RX antenna gain', unit: 'dBi', value: 2.15 },
      { id: 'f', label: 'Frequency', unit: 'MHz', value: 435 },
      { id: 'd', label: 'Distance', unit: 'km', value: 2000 },
      { id: 'lo', label: 'Other losses', unit: 'dB', value: 3 },
      { id: 'B', label: 'RX noise bandwidth', unit: 'Hz', value: 2500 },
      { id: 'NF', label: 'RX noise figure', unit: 'dB', value: 2 },
    ],
    compute: ({ pt, gt, gr, f, d, lo, B, NF }) => {
      const L = 32.45 + 20 * log10(f) + 20 * log10(d);
      const pr = pt + gt + gr - L - lo;
      const N = 10 * log10(K_B * 290 * 1e3) + 10 * log10(B) + NF;
      return [
        { k: 'EIRP', v: `${fmt(pt + gt)} dBm` },
        { k: 'FSPL', v: `${fmt(L)} dB` },
        { k: 'P_rx', v: `${fmt(pr)} dBm` },
        { k: 'Noise floor', v: `${fmt(N)} dBm` },
        { k: 'SNR', v: `${fmt(pr - N)} dB` },
      ];
    },
    model: 'Friis transmission equation with ITU-R P.525 free-space loss and a T<sub>0</sub> = 290 K noise floor. Add polarisation mismatch, pointing and atmospheric losses into “other losses”.',
  },
  {
    id: 'doppler',
    title: 'Doppler shift',
    inputs: [
      { id: 'f', label: 'Carrier', unit: 'MHz', value: 437.8 },
      { id: 'v', label: 'Range rate (- approaching)', unit: 'km/s', value: -7 },
    ],
    compute: ({ f, v }) => {
      const df = -f * 1e6 * (v * 1e3) / C0;
      return [
        { k: 'Δf', v: `${fmt(df / 1e3, 3)} kHz` },
        { k: 'Received', v: `${fmt(f + df / 1e6, 6)} MHz` },
      ];
    },
    model: 'First-order (non-relativistic) Doppler: Δf = -f·ṙ/c. Error is O((v/c)²), negligible for LEO (≈5×10<sup>-10</sup>).',
  },
];

route('calculators', view => {
  document.title = 'RF Calculators - frandomnoise';
  view.innerHTML = `<div class="page-head"><span class="label">Bench</span><h1>RF Calculators</h1>
    <p>Each calculator states the model it implements and where it stops being valid.</p></div>
    <div class="grid grid-2" id="calcs"></div>`;
  const root = $('#calcs');
  for (const c of calculators) {
    const saved = store(`fn-calc-${c.id}`) || {};
    const el = document.createElement('section');
    el.className = 'panel';
    el.innerHTML = `<div class="panel-head"><h2>${h(c.title)}</h2><span class="label">${h(c.id)}</span></div>
      ${c.inputs.map(i => {
        const val = saved[i.id] ?? i.value;
        const ctl = i.type === 'select'
          ? `<select id="${c.id}-${i.id}" data-k="${i.id}">${i.options.map(([v, t]) => `<option value="${v}"${v === val ? ' selected' : ''}>${h(t)}</option>`).join('')}</select>`
          : `<input type="number" step="any" id="${c.id}-${i.id}" data-k="${i.id}" value="${val}">`;
        return `<div class="field"><label for="${c.id}-${i.id}">${h(i.label)}</label>${ctl}<span class="unit">${h(i.unit || '')}</span></div>`;
      }).join('')}
      <div class="screen readout" aria-live="polite"></div>
      <div class="model">${c.model}</div>`;
    root.appendChild(el);
    const out = $('.readout', el);
    const run = () => {
      const v = {};
      el.querySelectorAll('[data-k]').forEach(x => { v[x.dataset.k] = x.tagName === 'SELECT' ? x.value : parseFloat(x.value); });
      store(`fn-calc-${c.id}`, v);
      const bad = Object.entries(v).some(([, x]) => typeof x === 'number' && !Number.isFinite(x));
      const rows = bad ? [{ k: 'Input', v: 'enter all values', warn: true }] : c.compute(v);
      out.innerHTML = rows.map(r => `<div class="row"><span class="k">${h(r.k)}</span><span class="${r.warn ? 'warn' : 'v'}">${h(r.v)}</span></div>`).join('');
    };
    el.addEventListener('input', run);
    run();
  }
});

/* ============================================================
   Frequency DB - ITU Region 1 / Spain (CNAF)
   Data: data/freqdb.json, compiled and validated at build time by
   scripts/freqdb.mjs from freqdb/*.json. Two layers:
     alloc  service allocations (RR Art. 5 Region 1, CNAF), no overlaps
     use    concrete signals and uses (AIS, ADS-B, APRS, satellites...)
   All frequencies are integer Hz. segs = [[lo, hi], ...], ch = spot channels.
   ============================================================ */
const FDB_CATS = [['amateur', 'Amateur'], ['broadcast', 'Broadcasting'], ['aviation', 'Aviation'], ['maritime', 'Maritime'],
  ['space', 'Satellite / GNSS'], ['science', 'Radio astronomy / time'], ['srd', 'ISM / SRD / Wi-Fi'], ['mobile', 'Mobile, fixed, other']];
const FDB_LICENCE = { exempt: ['exempt', 'Licence-exempt'], amateur: ['amateur', 'Amateur radio licence'], licensed: ['licensed', 'Licensed users only'], 'receive-only': ['RX only', 'Receive only'] };
const FDB_PRESETS = [['LF/MF', 3e4, 3e6], ['HF', 3e6, 3e7], ['VHF', 3e7, 3e8], ['UHF', 3e8, 3e9], ['SHF', 3e9, 3e10], ['All', 3e4, 3e10]];
const FDB_LIMITS = [4, 11];            // view limits, log10 Hz (10 kHz - 100 GHz)
const FDB_MIN_SPAN = Math.log10(1.0004); // narrowest view, about ±30 kHz at 145 MHz
const ITU_BANDS = [[3e3, 3e4, 'VLF'], [3e4, 3e5, 'LF'], [3e5, 3e6, 'MF'], [3e6, 3e7, 'HF'], [3e7, 3e8, 'VHF'], [3e8, 3e9, 'UHF'], [3e9, 3e10, 'SHF'], [3e10, 3e11, 'EHF']];
const GQRX_MOD = { NFM: 'Narrow FM', WFM: 'WFM (stereo)', AM: 'AM', USB: 'USB', LSB: 'LSB', CW: 'CW-U', RAW: 'Raw I/Q' };
const SDRPP_MODE = { NFM: 0, WFM: 1, AM: 2, USB: 4, CW: 5, LSB: 6, RAW: 7 };
let freqdbCache = null;

const trimNum = v => String(+v.toFixed(9));
const unitFor = x => x < 3e7 ? 'kHz' : x < 1e10 ? 'MHz' : 'GHz';
const UNIT_DIV = { Hz: 1, kHz: 1e3, MHz: 1e6, GHz: 1e9 };
const fmtHz = (x, u = unitFor(x)) => `${trimNum(x / UNIT_DIV[u])} ${u}`;
const fmtBW = x => fmtHz(x, x < 1e3 ? 'Hz' : x < 1e6 ? 'kHz' : 'MHz');
const fmtTick = x => fmtHz(x, x < 1e6 ? 'kHz' : x < 1e9 ? 'MHz' : 'GHz');
function fmtRange(lo, hi) {
  if (lo === hi) return fmtHz(lo);
  const u = unitFor(lo);
  if (u !== unitFor(hi)) return `${fmtHz(lo)} - ${fmtHz(hi)}`;
  return `${trimNum(lo / UNIT_DIV[u])} - ${fmtHz(hi, u)}`;
}
function niceStep(x) {
  const p = 10 ** Math.floor(Math.log10(x)), r = x / p;
  return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * p;
}

// "433.92" (MHz by default), "7074 kHz", "7074k", "10.489 GHz", "433,92" -> Hz, or null.
function parseFreqInput(s) {
  const m = /^\s*(\d+(?:[.,]\d*)?|[.,]\d+)\s*(hz|k|khz|m|mhz|g|ghz)?\s*$/i.exec(s || '');
  if (!m) return null;
  const v = parseFloat(m[1].replace(',', '.'));
  const u = (m[2] || 'm').toLowerCase()[0];
  const hz = Math.round(v * (u === 'h' ? 1 : u === 'k' ? 1e3 : u === 'g' ? 1e9 : 1e6));
  return hz > 0 ? hz : null;
}

function prepFreqDB(d) {
  for (const e of d.entries) {
    const pts = [...e.segs.flat(), ...e.ch.map(c => c.f)];
    e.lo = Math.min(...pts); e.hi = Math.max(...pts);
    e.search = [e.name, e.mode, e.notes, e.es, ...(e.services || []).map(s => s.name), ...e.tags, ...e.bands,
      ...(e.rr || []), e.decoder?.name, ...e.ch.map(c => c.label)].filter(Boolean).join(' ').toLowerCase();
  }
  return d;
}

// Lookup tolerance around spot frequencies: half the occupied bandwidth, else a default.
const fdbTol = (e, f) => e.bw ? Math.max(e.bw / 2, 500) : (f < 3e7 ? 1500 : 12500);
function fdbCovers(e, f) {
  for (const [lo, hi] of e.segs) {
    const t = lo === hi ? fdbTol(e, f) : 0;
    if (f >= lo - t && f <= hi + t) return true;
  }
  return e.ch.some(c => Math.abs(f - c.f) <= fdbTol(e, f));
}
// Does allocation a overlap any part of entry e?
const fdbOverlaps = (a, e) => a.segs.some(([lo, hi]) =>
  e.segs.some(([l, u]) => l <= hi && u >= lo) || e.ch.some(c => c.f >= lo && c.f <= hi));

function fdbFreqText(e) {
  if (e.segs.length === 1) return fmtRange(...e.segs[0]);
  if (e.segs.length > 1) return `${e.segs.length} bands, ${fmtRange(e.lo, e.hi)}`;
  if (e.ch.length <= 3) return e.ch.map(c => fmtHz(c.f)).join(', ');
  return `${e.ch.length} channels, ${fmtRange(e.lo, e.hi)}`;
}

function fdbTicks(lo, hi, W) {
  const dec = Math.log10(hi / lo), out = [];
  if (dec > 1) {
    const perDec = W / dec;
    const mults = perDec > 220 ? [1, 2, 5] : perDec > 70 ? [1, 3] : [1];
    const skipOdd = perDec < 45;
    for (let d = Math.floor(Math.log10(lo)); d <= Math.ceil(Math.log10(hi)); d++) {
      for (const m of mults) {
        const f = m * 10 ** d;
        if (f < lo || f > hi || (skipOdd && d % 2)) continue;
        out.push({ f, major: m === 1, label: m === 1 || perDec / mults.length > 70 });
      }
    }
  } else {
    const step = niceStep((hi - lo) / Math.max(2, Math.floor(W / 100)));
    for (let k = Math.ceil(lo / step); k * step <= hi; k++) out.push({ f: k * step, major: false, label: true });
  }
  return out;
}

function fdbDownload(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

route('freqdb', async (view, _, params) => {
  document.title = 'Frequency DB - frandomnoise';
  view.innerHTML = `<div class="page-head"><span class="label">Spectrum</span><h1>Frequency DB</h1><p class="muted">Loading…</p></div>`;
  let db;
  try { db = freqdbCache || (freqdbCache = prepFreqDB(await fetchJSON('data/freqdb.json'))); }
  catch (e) {
    view.innerHTML = `<div class="page-head"><span class="label">Spectrum</span><h1>Frequency DB</h1></div>
      <div class="notice">No <code>data/freqdb.json</code> available. It is compiled from <code>freqdb/*.json</code> by <code>node scripts/build.mjs</code>.</div>`;
    return;
  }
  const E = db.entries, byId = new Map(E.map(e => [e.id, e]));
  const tags = [...new Set(E.flatMap(e => e.tags))].sort();
  const p = params || new URLSearchParams();
  const st = {
    q: p.get('q') || '',
    tag: tags.includes(p.get('tag')) ? p.get('tag') : '',
    layer: ['alloc', 'use'].includes(p.get('layer')) ? p.get('layer') : '',
    f: parseFreqInput(p.get('f')),
    sel: byId.has(p.get('sel')) ? p.get('sel') : null,
  };
  let vw = { a: Math.log10(3e4), b: Math.log10(3e10) };
  let muf = null, current = [], raf = 0, alive = true;

  view.innerHTML = `<div class="page-head"><span class="label">Spectrum</span><h1>Frequency DB</h1>
    <p>Who may transmit where (ITU Region 1 allocations, with notes for Spain) and what you will actually hear there.</p></div>
    <div class="notice" style="margin-bottom:16px">Reference only, compiled by hand and still being checked entry by entry. Before you transmit, check the <a href="https://www.itu.int/pub/R-REG-RR" target="_blank" rel="noopener">ITU Radio Regulations</a> and the <a href="https://digital.gob.es/telecomunicaciones-infraestructuras-digitales/areas-interes/espectro-radioelectrico/cuadro-nacional-atribucion-frecuencias" target="_blank" rel="noopener">CNAF</a> (currently <a href="https://www.boe.es/buscar/act.php?id=BOE-A-2026-15661" target="_blank" rel="noopener">Orden TDF/732/2026</a>).</div>
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-head"><h2>Band plan</h2><span class="label" id="bp-range"></span></div>
      <div class="bp-tools" id="bp-tools">
        ${FDB_PRESETS.map(([n], i) => `<button class="btn ghost" type="button" data-preset="${i}">${n}</button>`).join('')}
        <span class="spacer"></span>
        <button class="btn ghost" type="button" data-zoom="out" aria-label="Zoom out">-</button>
        <button class="btn ghost" type="button" data-zoom="in" aria-label="Zoom in">+</button>
      </div>
      <div id="bp-host"><svg class="bandplan" id="bp" tabindex="0" role="img" aria-label="Band plan: allocations in the top row, uses and signals below. Arrow keys pan, plus and minus zoom."></svg></div>
      <div class="legend">${FDB_CATS.map(([c, n]) => `<span><i class="cat-${c}"></i>${h(n)}</span>`).join('')}</div>
      <p class="small muted" style="margin:6px 0 0">Top row: allocations. Below: uses and signals. Scroll or pinch to zoom, drag to pan. Click a block for its details, click empty space to look up that frequency.</p>
      <p class="small muted" id="bp-muf" style="margin:4px 0 0"></p>
    </div>
    <div class="panel" id="detail" hidden style="margin-bottom:16px"></div>
    <div class="panel">
      <div class="db-tools" id="fdb-tools">
        <input type="search" id="q" value="${h(st.q)}" placeholder="Search: name, service, mode, decoder…" aria-label="Search">
        <input type="text" inputmode="decimal" id="fq" value="${h(st.f ? fmtHz(st.f) : '')}" placeholder="Lookup: 433.92, 7074 kHz, 10.489 GHz" aria-label="Frequency lookup, in MHz unless a unit is given">
        <select id="tg" aria-label="Filter by tag"><option value="">All tags</option>${tags.map(t => `<option${t === st.tag ? ' selected' : ''}>${h(t)}</option>`).join('')}</select>
        <select id="ly" aria-label="Filter by layer"><option value="">All layers</option><option value="alloc"${st.layer === 'alloc' ? ' selected' : ''}>Allocations</option><option value="use"${st.layer === 'use' ? ' selected' : ''}>Uses and signals</option></select>
      </div>
      <p class="small" id="crumb" hidden></p>
      <div class="table-wrap"><table class="fdb">
        <thead><tr><th>Frequency</th><th>Name</th><th>Layer</th><th>Service / mode</th><th>Spain</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <p class="small muted" id="count"></p>
      <div class="bp-tools" id="export">
        <span class="label">Export the list</span>
        <button class="btn ghost" type="button" data-exp="csv">CSV</button>
        <button class="btn ghost" type="button" data-exp="gqrx">GQRX bookmarks</button>
        <button class="btn ghost" type="button" data-exp="sdrpp">SDR++ bookmarks</button>
        <span class="small muted" id="exp-msg"></span>
      </div>
      <p class="model">Exports follow the current filters. Bookmarks contain single frequencies and channels only (not ranges), with the suggested demodulator and bandwidth. GQRX: replace or merge <code>~/.config/gqrx/bookmarks.csv</code>. SDR++: Frequency Manager, Import.</p>
    </div>`;

  const host = $('#bp-host'), svg = $('#bp');
  const matches = e => (!st.layer || e.layer === st.layer) && (!st.tag || e.tags.includes(st.tag)) && (!st.q || e.search.includes(st.q.toLowerCase()));

  // ---------- URL state ----------
  function syncURL() {
    const q = new URLSearchParams();
    if (st.f) q.set('f', trimNum(st.f / 1e6));
    if (st.q) q.set('q', st.q);
    if (st.tag) q.set('tag', st.tag);
    if (st.layer) q.set('layer', st.layer);
    if (st.sel) q.set('sel', st.sel);
    const s = q.toString();
    history.replaceState(null, '', `#freqdb${s ? `?${s}` : ''}`);
  }

  // ---------- view (log10 Hz) ----------
  function setView(a, b) {
    const span = Math.min(Math.max(b - a, FDB_MIN_SPAN), FDB_LIMITS[1] - FDB_LIMITS[0]);
    if (span !== b - a) { const c = (a + b) / 2; a = c - span / 2; }
    a = Math.min(Math.max(a, FDB_LIMITS[0]), FDB_LIMITS[1] - span);
    vw = { a, b: a + span };
    schedule();
  }
  function zoomAt(fx, k) {
    const span = vw.b - vw.a, c = vw.a + fx * span, ns = span * k;
    setView(c - fx * ns, c - fx * ns + ns);
  }
  function zoomTo(e) {
    const la = Math.log10(e.lo), lb = Math.log10(e.hi);
    const pad = Math.max((lb - la) * 0.25, 0.004);
    setView(la - pad, lb + pad);
  }
  function centerOn(f) {
    const lf = Math.log10(f), span = vw.b - vw.a;
    if (lf < vw.a || lf > vw.b) setView(lf - span / 2, lf + span / 2);
  }
  const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (alive) drawPlan(); }); };

  // ---------- band plan ----------
  function drawPlan() {
    const W = Math.max(280, Math.round(host.clientWidth));
    const { a, b } = vw, span = b - a, fLo = 10 ** a, fHi = 10 ** b;
    const X = f => (Math.log10(f) - a) / span * W;
    const cx = x => Math.max(-4, Math.min(W + 4, x));
    const AX = 34, LANE = 18, GAP = 4, MAXL = 9, CW = 6.6, TOP = AX + 4, UT = TOP + LANE + 10;
    const vis = E.filter(e => matches(e) && e.hi >= fLo && e.lo <= fHi);
    const cls = e => {
      const hit = st.f && fdbCovers(e, st.f);
      return `item cat-${e.cat}${e.id === st.sel ? ' sel' : ''}${hit ? ' hit' : st.f ? ' dim' : ''}`;
    };
    const tip = e => `<title>${h(e.name)}: ${h(fdbFreqText(e))}</title>`;

    // Uses: one item per entry, greedy lane packing in pixel space.
    const items = vis.filter(e => e.layer === 'use').map(e => {
      const segs = e.segs.filter(([lo, hi]) => hi >= fLo && lo <= fHi).map(([lo, hi]) => [cx(X(lo)), cx(X(hi))]);
      const spots = e.ch.filter(c => c.f >= fLo && c.f <= fHi).map(c => cx(X(c.f)));
      const xs = [...segs.flat(), ...spots];
      const label = e.name.length > 30 ? `${e.name.slice(0, 29)}…` : e.name;
      return { e, segs, spots, x1: Math.min(...xs), x2: Math.max(...xs), label, lw: label.length * CW + 8 };
    }).filter(it => it.segs.length || it.spots.length).sort((p, q) => p.x1 - q.x1 || q.x2 - p.x2);
    const pack = beside => {
      const ends = [];
      for (const it of items) {
        it.lab = it.x2 - it.x1 >= it.lw ? 'in' : beside ? 'out' : null;
        const right = it.lab === 'out' ? it.x2 + it.lw : Math.max(it.x2, it.x1 + 3);
        let k = ends.findIndex(r => r + 2 <= it.x1);
        if (k < 0) { k = ends.length; ends.push(0); }
        ends[k] = right; it.lane = k;
      }
      return ends.length;
    };
    let lanes = pack(true);
    if (lanes > MAXL) lanes = pack(false);
    const hidden = items.filter(it => it.lane >= MAXL).length;
    lanes = Math.max(1, Math.min(lanes, MAXL));
    const H = UT + lanes * (LANE + GAP) + 6;

    const out = [];
    ITU_BANDS.forEach(([lo, hi, n], i) => {
      if (hi < fLo || lo > fHi) return;
      const x1 = cx(X(lo)), x2 = cx(X(hi));
      out.push(`<rect class="ituband${i % 2 ? ' odd' : ''}" x="${x1}" y="0" width="${x2 - x1}" height="${H}"/>`);
      if (x2 - x1 > 34) out.push(`<text class="itu" x="${(Math.max(x1, 0) + Math.min(x2, W)) / 2}" y="12" text-anchor="middle">${n}</text>`);
    });
    for (const t of fdbTicks(fLo, fHi, W)) {
      const x = X(t.f);
      out.push(`<line class="grid${t.major ? ' major' : ''}" x1="${x}" x2="${x}" y1="${AX - 6}" y2="${H}"/>`);
      if (t.label) out.push(`<text class="tick" x="${x + 3}" y="${AX - 8}">${h(fmtTick(t.f))}</text>`);
    }
    for (const e of vis.filter(e => e.layer === 'alloc')) {
      const [lo, hi] = e.segs[0];
      const x1 = cx(X(lo)), w = Math.max(cx(X(hi)) - x1, 1.5);
      const room = Math.floor((w - 8) / CW);
      const lab = e.name.length <= room ? e.name : room >= 6 ? `${e.name.slice(0, room - 1)}…` : '';
      out.push(`<g class="${cls(e)}" data-id="${e.id}">${tip(e)}<rect x="${x1}" y="${TOP}" width="${w}" height="${LANE}" rx="2"/>${lab ? `<text x="${x1 + 4}" y="${TOP + 13}">${h(lab)}</text>` : ''}</g>`);
    }
    for (const it of items) {
      if (it.lane >= MAXL) continue;
      const y = UT + it.lane * (LANE + GAP), g = [];
      g.push(`<rect class="hitbox" x="${it.x1 - 3}" y="${y}" width="${it.x2 - it.x1 + 6 + (it.lab === 'out' ? it.lw : 0)}" height="${LANE}"/>`);
      for (const [x1, x2] of it.segs) g.push(x2 - x1 < 2
        ? `<line class="spot" x1="${x1}" x2="${x1}" y1="${y}" y2="${y + LANE}"/>`
        : `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="${LANE}" rx="2"/>`);
      for (const x of it.spots) g.push(`<line class="spot" x1="${x}" x2="${x}" y1="${y}" y2="${y + LANE}"/>`);
      if (it.lab) g.push(`<text x="${it.lab === 'in' ? it.x1 + 4 : it.x2 + 4}" y="${y + 13}">${h(it.label)}</text>`);
      out.push(`<g class="${cls(it.e)}" data-id="${it.e.id}">${tip(it.e)}${g.join('')}</g>`);
    }
    if (muf && muf.v >= fLo && muf.v <= fHi) {
      const x = X(muf.v);
      out.push(`<line class="muf" x1="${x}" x2="${x}" y1="${AX - 6}" y2="${H}"/><text class="muf-t" x="${x + 3}" y="${H - 5}">MUF ${fmt(muf.v / 1e6, 1)} MHz</text>`);
    }
    if (st.f && st.f >= fLo && st.f <= fHi) {
      const x = X(st.f);
      out.push(`<line class="marker" x1="${x}" x2="${x}" y1="${AX - 6}" y2="${H}"/>`);
    }
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);
    svg.innerHTML = out.join('');
    // View edges to the precision the zoom level can resolve.
    const digits = Math.min(9, Math.max(3, Math.ceil(-Math.log10(1 - 10 ** -span)) + 2));
    const edge = x => { const u = x < 1e6 ? 'kHz' : x < 1e9 ? 'MHz' : 'GHz'; return `${+(x / UNIT_DIV[u]).toPrecision(digits)} ${u}`; };
    $('#bp-range').textContent = `${edge(fLo)} - ${edge(fHi)}${hidden ? `, ${hidden} more: zoom in` : ''}`;
  }

  // ---------- table ----------
  function drawTable() {
    let list = E.filter(matches);
    if (st.f) list = list.filter(e => fdbCovers(e, st.f));
    // With a lookup: allocations first, then from the widest use to the most specific.
    list.sort((p, q) => st.f
      ? (p.layer !== q.layer ? (p.layer === 'alloc' ? -1 : 1) : (q.hi - q.lo) - (p.hi - p.lo))
      : p.lo - q.lo || p.hi - q.hi || (p.layer === 'alloc' ? -1 : 1));
    current = list;
    $('#rows').innerHTML = list.map(e => `<tr data-id="${e.id}"${e.id === st.sel ? ' class="sel"' : ''}>
      <td class="freq">${h(fdbFreqText(e))}</td>
      <td><i class="sw cat-${e.cat}"></i>${h(e.name)}</td>
      <td class="small muted">${e.layer === 'alloc' ? 'allocation' : 'use'}</td>
      <td class="small">${h(e.layer === 'alloc' ? e.services.map(s => s.name).join(', ') : e.mode || '')}</td>
      <td class="small">${e.licence ? h(FDB_LICENCE[e.licence][0]) : ''}</td></tr>`).join('')
      || '<tr><td colspan="5" class="muted">No match.</td></tr>';
    const unv = E.filter(e => !e.verified).length;
    $('#count').textContent = `${list.length} of ${E.length} entries.${unv ? ` ${unv} not yet verified against their sources.` : ''}`;
    const crumb = $('#crumb');
    crumb.hidden = !st.f;
    if (st.f) {
      const link = e => `<button type="button" class="linkish" data-sel="${e.id}">${h(e.name)}</button>`;
      const al = E.filter(e => e.layer === 'alloc' && fdbCovers(e, st.f));
      const us = E.filter(e => e.layer === 'use' && fdbCovers(e, st.f)).sort((p, q) => (q.hi - q.lo) - (p.hi - p.lo));
      crumb.innerHTML = `<b class="mono">${h(fmtHz(st.f))}</b> → ${al.length ? al.map(link).join(', ') : '<span class="muted">no allocation recorded</span>'}${us.length ? ` → ${us.map(link).join(', ')}` : ''}`;
    }
  }

  // ---------- details ----------
  function hfNow(e) {
    if (!muf || e.lo < 1.8e6 || e.hi > 3e7) return null;
    const open = e.lo <= muf.v;
    return `Median MUF(3000)F2 of ${muf.n} European ionosonde${muf.n > 1 ? 's' : ''} is ${fmt(muf.v / 1e6, 1)} MHz (${muf.t} UTC): <b>${open ? 'likely open' : 'likely closed'}</b> for single hops of about 3000 km. Shorter paths need lower frequencies.`;
  }
  function renderDetail() {
    const d = $('#detail'), e = byId.get(st.sel);
    if (!e) { d.hidden = true; d.innerHTML = ''; return; }
    const kv = [];
    const add = (k, v) => { if (v) kv.push(`<dt>${k}</dt><dd>${v}</dd>`); };
    const link = x => `<button type="button" class="linkish" data-sel="${x.id}">${h(x.name)}</button> <span class="muted">${h(fdbFreqText(x))}</span>`;
    const ext = (href, text) => `<a href="${h(href)}" target="_blank" rel="noopener">${h(text)}</a>`;
    add('Frequency', e.segs.map(s => h(fmtRange(...s))).join('<br>'));
    if (e.ch.length) add('Channels', e.ch.map(c => `${h(fmtHz(c.f))}${c.label ? ` <span class="muted">${h(c.label)}</span>` : ''}`).join('<br>'));
    if (e.layer === 'alloc') {
      add('Services', e.services.map(s => `${h(s.name)} <span class="muted">${s.primary ? 'primary' : 'secondary'}</span>`).join('<br>'));
      add('Uses here', E.filter(u => u.layer === 'use' && fdbOverlaps(e, u)).map(link).join('<br>'));
    } else {
      add('Within', E.filter(a => a.layer === 'alloc' && fdbOverlaps(a, e)).map(link).join('<br>') || '<span class="muted">no allocation recorded</span>');
    }
    add('Mode', e.mode && h(e.mode));
    add('Bandwidth', e.bw && h(fmtBW(e.bw)));
    add('Channel raster', e.raster && h(fmtBW(e.raster)));
    add('Polarization', e.pol && h(e.pol));
    add('Licence (Spain)', e.licence && h(FDB_LICENCE[e.licence][1]));
    add('Spain', e.es && h(e.es));
    add('Notes', e.notes && h(e.notes));
    if (e.layer === 'alloc') {
      add('RR footnotes', e.rr.length ? h(e.rr.join(', ')) : '<span class="muted">none recorded</span>');
      add('CNAF UN notes', e.un.length ? h(e.un.join(', ')) : '<span class="muted">not recorded yet</span>');
    }
    add('HF now', hfNow(e));
    add('Decoder', e.decoder && ext(e.decoder.url, e.decoder.name));
    add('How to receive', e.howto && (/^https?:/.test(e.howto.href) ? ext(e.howto.href, e.howto.label) : `<a href="${h(e.howto.href)}">${h(e.howto.label)}</a>`));
    if (e.sat) {
      const dl = e.ch[0]?.f ?? e.segs[e.segs.length - 1]?.[0];
      const q = new URLSearchParams({ norad: e.sat.norad, ...(e.sat.group ? { group: e.sat.group } : {}), ...(dl ? { dl: trimNum(dl / 1e6) } : {}) });
      add('Satellite', `<a href="#satellites?${q}">Track NORAD ${e.sat.norad}${dl ? `, Doppler on ${h(fmtHz(dl, 'MHz'))}` : ''}</a>`);
    }
    add('Sources', e.src.map(s => `${s.url ? ext(s.url, s.title) : h(s.title)}${s.detail ? `, ${h(s.detail)}` : ''}`).join('<br>'));
    add('Status', e.verified ? 'verified against the sources' : '<span class="draft-badge">not yet verified against the sources</span>');
    d.hidden = false;
    d.innerHTML = `<div class="panel-head"><h2>${h(e.name)}</h2><span class="label">${e.layer === 'alloc' ? 'allocation' : 'use / signal'}</span></div>
      <dl class="kv fdb-kv">${kv.join('')}</dl>
      <div class="bp-tools" style="margin-top:12px">
        <button class="btn ghost" type="button" data-act="zoom">Show in band plan</button>
        <button class="btn ghost" type="button" data-act="copy">Copy link</button>
        <button class="btn ghost" type="button" data-act="close">Close</button>
        <span class="small muted" id="copy-msg"></span>
      </div>`;
  }

  // ---------- actions ----------
  function refresh() { drawTable(); schedule(); syncURL(); }
  function select(id, { scroll = false } = {}) {
    st.sel = byId.has(id) ? id : null;
    renderDetail();
    refresh();
    if (scroll && st.sel) $('#detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function setF(f) {
    st.f = f;
    $('#fq').value = f ? fmtHz(f) : '';
    if (f) centerOn(f);
    refresh();
  }

  $('#fdb-tools').addEventListener('input', e => {
    if (e.target.id === 'q') st.q = e.target.value.trim();
    if (e.target.id === 'tg') st.tag = e.target.value;
    if (e.target.id === 'ly') st.layer = e.target.value;
    if (e.target.id === 'fq') { st.f = parseFreqInput(e.target.value); if (st.f) centerOn(st.f); }
    refresh();
  });
  $('#rows').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]');
    if (tr) select(tr.dataset.id, { scroll: true });
  });
  view.addEventListener('click', e => {
    const s = e.target.closest('[data-sel]');
    if (s) { select(s.dataset.sel, { scroll: true }); return; }
    const pr = e.target.closest('[data-preset]');
    if (pr) { const [, lo, hi] = FDB_PRESETS[+pr.dataset.preset]; setView(Math.log10(lo), Math.log10(hi)); return; }
    const z = e.target.closest('[data-zoom]');
    if (z) { zoomAt(0.5, z.dataset.zoom === 'in' ? 0.5 : 2); return; }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'zoom' && byId.get(st.sel)) { zoomTo(byId.get(st.sel)); host.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    if (act === 'close') select(null);
    if (act === 'copy') {
      navigator.clipboard?.writeText(location.href).then(() => { $('#copy-msg').textContent = 'Copied.'; }, () => { $('#copy-msg').textContent = location.href; });
    }
    const exp = e.target.closest('[data-exp]')?.dataset.exp;
    if (exp) doExport(exp);
  });

  // Pointer: drag to pan, pinch to zoom, click to select or look up.
  const ptrs = new Map();
  let gesture = null;
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    svg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) gesture = { x0: e.clientX, y0: e.clientY, moved: false, multi: false };
    else if (gesture) gesture.multi = true;
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId) || !gesture) return;
    const r = svg.getBoundingClientRect(), prev = ptrs.get(e.pointerId);
    if (ptrs.size === 1) {
      if (Math.abs(e.clientX - gesture.x0) > 4 || Math.abs(e.clientY - gesture.y0) > 4) gesture.moved = true;
      if (gesture.moved) { const s = (vw.b - vw.a) * (e.clientX - prev.x) / r.width; setView(vw.a - s, vw.b - s); }
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    } else if (ptrs.size === 2) {
      const [p1, p2] = [...ptrs.values()], d0 = Math.abs(p1.x - p2.x);
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const [q1, q2] = [...ptrs.values()], d1 = Math.abs(q1.x - q2.x);
      if (d0 > 10 && d1 > 10) zoomAt(((q1.x + q2.x) / 2 - r.left) / r.width, d0 / d1);
      gesture.moved = true;
    }
  });
  const pointerEnd = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (e.type === 'pointerup' && !ptrs.size && gesture && !gesture.moved && !gesture.multi) planClick(e);
    if (!ptrs.size) gesture = null;
  };
  svg.addEventListener('pointerup', pointerEnd);
  svg.addEventListener('pointercancel', pointerEnd);
  function planClick(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-id]');
    if (el && svg.contains(el)) { select(el.dataset.id); return; }
    const r = svg.getBoundingClientRect(), span = vw.b - vw.a;
    const f = 10 ** (vw.a + (e.clientX - r.left) / r.width * span);
    const step = niceStep(f * (10 ** (2 * span / r.width) - 1)); // about 2 px of resolution
    setF(Math.round(f / step) * step);
  }
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), k = e.deltaMode === 1 ? 16 : 1;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { const s = (vw.b - vw.a) * e.deltaX * k / r.width; setView(vw.a + s, vw.b + s); }
    else zoomAt((e.clientX - r.left) / r.width, Math.exp(e.deltaY * k * 0.0015));
  }, { passive: false });
  svg.addEventListener('keydown', e => {
    const s = (vw.b - vw.a) * 0.1;
    if (e.key === 'ArrowLeft') setView(vw.a - s, vw.b - s);
    else if (e.key === 'ArrowRight') setView(vw.a + s, vw.b + s);
    else if (e.key === '+' || e.key === '=') zoomAt(0.5, 0.7);
    else if (e.key === '-') zoomAt(0.5, 1 / 0.7);
    else if (e.key === 'Escape') select(null);
    else return;
    e.preventDefault();
  });

  // ---------- export ----------
  const csvCell = v => { v = String(v ?? ''); return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const spotsOf = list => list.filter(e => e.demod).flatMap(e => [
    ...e.segs.filter(([lo, hi]) => lo === hi).map(([f]) => ({ f, name: e.name })),
    ...e.ch.map(c => ({ f: c.f, name: `${e.name} (${c.label || fmtHz(c.f)})` })),
  ].map(s => ({ ...s, demod: e.demod, bw: e.bw || 10000 })));
  function doExport(kind) {
    const msg = $('#exp-msg');
    if (kind === 'csv') {
      const head = ['id', 'layer', 'name', 'segments_hz', 'channels_hz', 'services', 'mode', 'bandwidth_hz', 'raster_hz', 'polarization',
        'demod', 'licence_es', 'spain', 'notes', 'rr_footnotes', 'cnaf_un', 'tags', 'sources', 'verified'];
      const rows = current.map(e => [e.id, e.layer, e.name, e.segs.map(s => s.join('-')).join(' '),
        e.ch.map(c => `${c.f}${c.label ? ` ${c.label}` : ''}`).join(' | '), (e.services || []).map(s => s.name).join(' | '),
        e.mode, e.bw, e.raster, e.pol, e.demod, e.licence, e.es, e.notes, (e.rr || []).join(' '), (e.un || []).join(' '),
        e.tags.join(' '), e.src.map(s => s.title + (s.detail ? ` ${s.detail}` : '')).join(' | '), e.verified]);
      fdbDownload('freqdb.csv', [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n', 'text/csv');
      msg.textContent = `${rows.length} entries exported.`;
      return;
    }
    const pts = spotsOf(current);
    if (!pts.length) { msg.textContent = 'No single frequencies in the current list.'; return; }
    if (kind === 'gqrx') {
      const lines = ['# Tag name          ;  color', 'Untagged            ; #c0c0c0', 'frandomnoise        ; #34d06a', '',
        '# Frequency ; Name                     ; Modulation          ;  Bandwidth; Tags'];
      for (const s of pts) lines.push(`${String(s.f).padStart(12)} ; ${s.name.replace(/;/g, ',').padEnd(25)} ; ${GQRX_MOD[s.demod].padEnd(20)}; ${String(s.bw).padStart(10)}; frandomnoise`);
      fdbDownload('bookmarks.csv', lines.join('\n') + '\n', 'text/csv');
    } else {
      const bookmarks = {};
      for (const s of pts) {
        let n = s.name, k = 2;
        while (bookmarks[n]) n = `${s.name} ${k++}`;
        bookmarks[n] = { bandwidth: s.bw, frequency: s.f, mode: SDRPP_MODE[s.demod] };
      }
      fdbDownload('frandomnoise-sdrpp.json', JSON.stringify({ bookmarks }, null, 2) + '\n', 'application/json');
    }
    msg.textContent = `${pts.length} bookmarks exported.`;
  }

  // ---------- HF propagation (optional) ----------
  fetchJSON('data/propagation.json').then(d => {
    const v = (d.ionosondes || []).map(s => s.mufd).filter(Number.isFinite).sort((x, y) => x - y);
    const ageH = (Date.now() - Date.parse(d.updated)) / 3600e3;
    if (!alive || !v.length || !(ageH < 12)) return;
    const n = v.length, med = n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2;
    muf = { v: Math.round(med * 1e5) * 10, n, t: new Date(d.updated).toISOString().slice(11, 16) };
    $('#bp-muf').innerHTML = `Dashed line: median MUF(3000)F2 of ${fmt(med, 1)} MHz from ${n} European ionosonde${n > 1 ? 's' : ''} (${muf.t} UTC, see <a href="#propagation">Propagation</a>). HF bands below it are likely open for single hops of about 3000 km.`;
    schedule();
    renderDetail();
  }).catch(() => {});

  // ---------- initial state ----------
  if (st.sel) zoomTo(byId.get(st.sel));
  else if (st.f) { const lf = Math.log10(st.f); setView(lf - 0.15, lf + 0.15); }
  renderDetail();
  drawTable();
  drawPlan();
  const ro = new ResizeObserver(schedule);
  ro.observe(host);
  return () => { alive = false; ro.disconnect(); cancelAnimationFrame(raf); };
});

/* ============================================================
   SGP4 / SDP4
   Port of the reference implementation by Vallado, Crawford, Hujsak
   and Kelso, "Revisiting Spacetrack Report #3" (AIAA 2006-6753),
   2020 C++ release, "improved" operation mode, WGS-72 constants
   (the constants the TLEs are fitted with). Output: TEME frame, km
   and km/s. Deep-space (period >= 225 min) lunar-solar terms and
   12 h / 24 h resonances included.
   ============================================================ */
const SGP4 = (() => {
  const pi = Math.PI, twopi = 2 * pi, x2o3 = 2 / 3;
  const { sin, cos, sqrt, atan2, abs } = Math;
  // WGS-72
  const mu = 398600.8, radiusearthkm = 6378.135;
  const xke = 60 / sqrt(radiusearthkm ** 3 / mu), tumin = 1 / xke;
  const j2 = 0.001082616, j3 = -0.00000253881, j4 = -0.00000165597, j3oj2 = j3 / j2;

  function gstime(jdut1) {
    const tut1 = (jdut1 - 2451545.0) / 36525.0;
    let temp = -6.2e-6 * tut1 * tut1 * tut1 + 0.093104 * tut1 * tut1 +
      (876600.0 * 3600 + 8640184.812866) * tut1 + 67310.54841;
    temp = (temp * (pi / 180) / 240.0) % twopi;
    return temp < 0 ? temp + twopi : temp;
  }

  function dpper(s, init, ep, inclp, nodep, argpp, mp) {
    const zns = 1.19459e-5, zes = 0.01675, znl = 1.5835218e-4, zel = 0.05490;
    let zm = init ? s.zmos : s.zmos + zns * s.t;
    let zf = zm + 2 * zes * sin(zm), sinzf = sin(zf);
    let f2 = 0.5 * sinzf * sinzf - 0.25, f3 = -0.5 * sinzf * cos(zf);
    const ses = s.se2 * f2 + s.se3 * f3, sis = s.si2 * f2 + s.si3 * f3;
    const sls = s.sl2 * f2 + s.sl3 * f3 + s.sl4 * sinzf;
    const sghs = s.sgh2 * f2 + s.sgh3 * f3 + s.sgh4 * sinzf, shs = s.sh2 * f2 + s.sh3 * f3;
    zm = init ? s.zmol : s.zmol + znl * s.t;
    zf = zm + 2 * zel * sin(zm); sinzf = sin(zf);
    f2 = 0.5 * sinzf * sinzf - 0.25; f3 = -0.5 * sinzf * cos(zf);
    const sel = s.ee2 * f2 + s.e3 * f3, sil = s.xi2 * f2 + s.xi3 * f3;
    const sll = s.xl2 * f2 + s.xl3 * f3 + s.xl4 * sinzf;
    const sghl = s.xgh2 * f2 + s.xgh3 * f3 + s.xgh4 * sinzf, shll = s.xh2 * f2 + s.xh3 * f3;
    let pe = ses + sel, pinc = sis + sil, pl = sls + sll, pgh = sghs + sghl, ph = shs + shll;
    if (!init) {
      pe -= s.peo; pinc -= s.pinco; pl -= s.plo; pgh -= s.pgho; ph -= s.pho;
      inclp += pinc; ep += pe;
      const sinip = sin(inclp), cosip = cos(inclp);
      if (inclp >= 0.2) {
        ph /= sinip; pgh -= cosip * ph;
        argpp += pgh; nodep += ph; mp += pl;
      } else {
        const sinop = sin(nodep), cosop = cos(nodep);
        let alfdp = sinip * sinop, betdp = sinip * cosop;
        alfdp += ph * cosop + pinc * cosip * sinop;
        betdp += -ph * sinop + pinc * cosip * cosop;
        nodep %= twopi;
        const xls = mp + argpp + pl + pgh + (cosip - pinc * sinip) * nodep;
        const xnoh = nodep;
        nodep = atan2(alfdp, betdp);
        if (abs(xnoh - nodep) > pi) nodep += nodep < xnoh ? twopi : -twopi;
        mp += pl;
        argpp = xls - mp - cosip * nodep;
      }
    }
    return [ep, inclp, nodep, argpp, mp];
  }

  function dscom(epoch, ep, argpp, tc, inclp, nodep, np, s) {
    const zes = 0.01675, zel = 0.05490, c1ss = 2.9864797e-6, c1l = 4.7968065e-7;
    const zsinis = 0.39785416, zcosis = 0.91744867, zcosgs = 0.1945905, zsings = -0.98088458;
    const o = {};
    o.nm = np; o.em = ep;
    o.snodm = sin(nodep); o.cnodm = cos(nodep);
    o.sinomm = sin(argpp); o.cosomm = cos(argpp);
    o.sinim = sin(inclp); o.cosim = cos(inclp);
    o.emsq = o.em * o.em;
    const betasq = 1 - o.emsq;
    o.rtemsq = sqrt(betasq);
    s.peo = 0; s.pinco = 0; s.plo = 0; s.pgho = 0; s.pho = 0;
    o.day = epoch + 18261.5 + tc / 1440;
    const xnodce = (4.5236020 - 9.2422029e-4 * o.day) % twopi;
    const stem = sin(xnodce), ctem = cos(xnodce);
    const zcosil = 0.91375164 - 0.03568096 * ctem;
    const zsinil = sqrt(1 - zcosil * zcosil);
    const zsinhl = 0.089683511 * stem / zsinil;
    const zcoshl = sqrt(1 - zsinhl * zsinhl);
    o.gam = 5.8351514 + 0.0019443680 * o.day;
    let zx = 0.39785416 * stem / zsinil;
    const zy = zcoshl * ctem + 0.91744867 * zsinhl * stem;
    zx = atan2(zx, zy);
    zx = o.gam + zx - xnodce;
    const zcosgl = cos(zx), zsingl = sin(zx);
    let zcosg = zcosgs, zsing = zsings, zcosi = zcosis, zsini = zsinis;
    let zcosh = o.cnodm, zsinh = o.snodm, cc = c1ss;
    const xnoi = 1 / o.nm;
    const { cosim, sinim, cosomm, sinomm, emsq } = o;
    for (let lsflg = 1; lsflg <= 2; lsflg++) {
      const a1 = zcosg * zcosh + zsing * zcosi * zsinh;
      const a3 = -zsing * zcosh + zcosg * zcosi * zsinh;
      const a7 = -zcosg * zsinh + zsing * zcosi * zcosh;
      const a8 = zsing * zsini;
      const a9 = zsing * zsinh + zcosg * zcosi * zcosh;
      const a10 = zcosg * zsini;
      const a2 = cosim * a7 + sinim * a8;
      const a4 = cosim * a9 + sinim * a10;
      const a5 = -sinim * a7 + cosim * a8;
      const a6 = -sinim * a9 + cosim * a10;
      const x1 = a1 * cosomm + a2 * sinomm;
      const x2 = a3 * cosomm + a4 * sinomm;
      const x3 = -a1 * sinomm + a2 * cosomm;
      const x4 = -a3 * sinomm + a4 * cosomm;
      const x5 = a5 * sinomm, x6 = a6 * sinomm, x7 = a5 * cosomm, x8 = a6 * cosomm;
      o.z31 = 12 * x1 * x1 - 3 * x3 * x3;
      o.z32 = 24 * x1 * x2 - 6 * x3 * x4;
      o.z33 = 12 * x2 * x2 - 3 * x4 * x4;
      o.z1 = 3 * (a1 * a1 + a2 * a2) + o.z31 * emsq;
      o.z2 = 6 * (a1 * a3 + a2 * a4) + o.z32 * emsq;
      o.z3 = 3 * (a3 * a3 + a4 * a4) + o.z33 * emsq;
      o.z11 = -6 * a1 * a5 + emsq * (-24 * x1 * x7 - 6 * x3 * x5);
      o.z12 = -6 * (a1 * a6 + a3 * a5) + emsq * (-24 * (x2 * x7 + x1 * x8) - 6 * (x3 * x6 + x4 * x5));
      o.z13 = -6 * a3 * a6 + emsq * (-24 * x2 * x8 - 6 * x4 * x6);
      o.z21 = 6 * a2 * a5 + emsq * (24 * x1 * x5 - 6 * x3 * x7);
      o.z22 = 6 * (a4 * a5 + a2 * a6) + emsq * (24 * (x2 * x5 + x1 * x6) - 6 * (x4 * x7 + x3 * x8));
      o.z23 = 6 * a4 * a6 + emsq * (24 * x2 * x6 - 6 * x4 * x8);
      o.z1 = o.z1 + o.z1 + betasq * o.z31;
      o.z2 = o.z2 + o.z2 + betasq * o.z32;
      o.z3 = o.z3 + o.z3 + betasq * o.z33;
      o.s3 = cc * xnoi;
      o.s2 = -0.5 * o.s3 / o.rtemsq;
      o.s4 = o.s3 * o.rtemsq;

    let tempa = 1 - s.cc1 * t, tempe = s.bstar * s.cc4 * t, templ = s.t2cof * t2;
    if (s.isimp !== 1) {
      const delomg = s.omgcof * t;
      const delm = s.xmcof * ((1 + s.eta * cos(xmdf)) ** 3 - s.delmo);
      const temp = delomg + delm;
      m.mm = xmdf + temp;
      m.argpm = argpdf - temp;
      const t3 = t2 * t, t4 = t3 * t;
      tempa -= s.d2 * t2 + s.d3 * t3 + s.d4 * t4;
      tempe += s.bstar * s.cc5 * (sin(m.mm) - s.sinmao);
      templ += s.t3cof * t3 + t4 * (s.t4cof + t * s.t5cof);
    }
    if (s.method === 'd') dspace(s, t, t, m);
    let { nm, em, inclm, mm, argpm, nodem } = m;
    if (nm <= 0) { s.error = 2; return null; }
    const am = (xke / nm) ** x2o3 * tempa * tempa;
    nm = xke / am ** 1.5;
    em -= tempe;
    if (em >= 1 || em < -0.001) { s.error = 1; return null; }
    if (em < 1e-6) em = 1e-6;
    mm += s.no_unkozai * templ;
    let xlm = mm + argpm + nodem;
    nodem %= twopi;
    argpm %= twopi;
    xlm %= twopi;
    mm = (xlm - argpm - nodem) % twopi;
    let ep = em, xincp = inclm, argpp = argpm, nodep = nodem, mp = mm;
    let sinip = sin(inclm), cosip = cos(inclm);
    if (s.method === 'd') {
      [ep, xincp, nodep, argpp, mp] = dpper(s, false, ep, xincp, nodep, argpp, mp);
      if (xincp < 0) { xincp = -xincp; nodep += pi; argpp -= pi; }
      if (ep < 0 || ep > 1) { s.error = 3; return null; }
      sinip = sin(xincp); cosip = cos(xincp);
      s.aycof = -0.5 * j3oj2 * sinip;
      s.xlcof = -0.25 * j3oj2 * sinip * (3 + 5 * cosip) / (abs(cosip + 1) > 1.5e-12 ? 1 + cosip : temp4);
    }
    const axnl = ep * cos(argpp);
    let temp = 1 / (am * (1 - ep * ep));
    const aynl = ep * sin(argpp) + temp * s.aycof;
    const xl = mp + argpp + nodep + temp * s.xlcof * axnl;
    const u = (xl - nodep) % twopi;
    let eo1 = u, tem5 = 9999.9, ktr = 1, sineo1 = 0, coseo1 = 0;
    while (abs(tem5) >= 1e-12 && ktr <= 10) {
      sineo1 = sin(eo1); coseo1 = cos(eo1);
      tem5 = 1 - coseo1 * axnl - sineo1 * aynl;
      tem5 = (u - aynl * coseo1 + axnl * sineo1 - eo1) / tem5;
      if (abs(tem5) >= 0.95) tem5 = tem5 > 0 ? 0.95 : -0.95;
      eo1 += tem5;
      ktr++;
    }
    const ecose = axnl * coseo1 + aynl * sineo1;
    const esine = axnl * sineo1 - aynl * coseo1;
    const el2 = axnl * axnl + aynl * aynl;
    const pl = am * (1 - el2);
    if (pl < 0) { s.error = 4; return null; }
    const rl = am * (1 - ecose);
    const rdotl = sqrt(am) * esine / rl;
    const rvdotl = sqrt(pl) / rl;
    const betal = sqrt(1 - el2);
    temp = esine / (1 + betal);
    const sinu = am / rl * (sineo1 - aynl - axnl * temp);
    const cosu = am / rl * (coseo1 - axnl + aynl * temp);
    let su = atan2(sinu, cosu);
    const sin2u = (cosu + cosu) * sinu, cos2u = 1 - 2 * sinu * sinu;
    temp = 1 / pl;
    const temp1 = 0.5 * j2 * temp, temp2 = temp1 * temp;
    if (s.method === 'd') {
      const cosisq = cosip * cosip;
      s.con41 = 3 * cosisq - 1;
      s.x1mth2 = 1 - cosisq;
      s.x7thm1 = 7 * cosisq - 1;
    }
    const mrt = rl * (1 - 1.5 * temp2 * betal * s.con41) + 0.5 * temp1 * s.x1mth2 * cos2u;
    su -= 0.25 * temp2 * s.x7thm1 * sin2u;
    const xnode = nodep + 1.5 * temp2 * cosip * sin2u;
    const xinc = xincp + 1.5 * temp2 * cosip * sinip * cos2u;
    const mvt = rdotl - nm * temp1 * s.x1mth2 * sin2u / xke;
    const rvdot = rvdotl + nm * temp1 * (s.x1mth2 * cos2u + 1.5 * s.con41) / xke;
    const sinsu = sin(su), cossu = cos(su), snod = sin(xnode), cnod = cos(xnode);
    const sini = sin(xinc), cosi = cos(xinc);
    const xmx = -snod * cosi, xmy = cnod * cosi;
    const ux = xmx * sinsu + cnod * cossu, uy = xmy * sinsu + snod * cossu, uz = sini * sinsu;
    const vx = xmx * cossu - cnod * sinsu, vy = xmy * cossu - snod * sinsu, vz = sini * cossu;
    const mr = mrt * radiusearthkm;
    const r = [mr * ux, mr * uy, mr * uz];
    const v = [(mvt * ux + rvdot * vx) * vkmpersec, (mvt * uy + rvdot * vy) * vkmpersec, (mvt * uz + rvdot * vz) * vkmpersec];
    if (mrt < 1) s.error = 6;
    return { r, v };
  }

  // Parse a TLE (line 1, line 2) into an initialised satellite record.
  function twoline(name, l1, l2) {
    const num = (str) => { const x = parseFloat(str); if (!Number.isFinite(x)) throw new Error('bad TLE field'); return x; };
    const expo = (str) => num((str[0] === '-' ? '-' : '') + '0.' + str.slice(1, 6).trim()) * 10 ** parseInt(str.slice(6, 8), 10);
    if (!l1.startsWith('1 ') || !l2.startsWith('2 ') || l1.length < 64 || l2.length < 63) throw new Error('bad TLE');
    const xpdotp = 1440 / twopi;
    const yy = parseInt(l1.slice(18, 20), 10);
    const year = yy < 57 ? 2000 + yy : 1900 + yy;
    const epochdays = num(l1.slice(20, 32));
    const s = {
      name, norad: l1.slice(2, 7).trim(),
      ndot: num(l1.slice(33, 43)) / (xpdotp * 1440),
      nddot: expo(l1.slice(44, 52).padEnd(8)) / (xpdotp * 1440 * 1440),
      bstar: expo(l1.slice(53, 61)),
      inclo: num(l2.slice(8, 16)) * pi / 180,
      nodeo: num(l2.slice(17, 25)) * pi / 180,
      ecco: num('0.' + l2.slice(26, 33).replace(/ /g, '0')),
      argpo: num(l2.slice(34, 42)) * pi / 180,
      mo: num(l2.slice(43, 51)) * pi / 180,
      no_kozai: num(l2.slice(52, 63)) / xpdotp,
    };
    // days since 1949-12-31 00:00 UTC (SGP4 epoch convention)
    const jan1 = (Date.UTC(year, 0, 1) - Date.UTC(1949, 11, 31)) / 86400e3;
    s.epochSgp4 = jan1 + (epochdays - 1);
    s.epochMs = Date.UTC(year, 0, 1) + (epochdays - 1) * 86400e3;
    init(s, s.epochSgp4);
    if (s.error && s.error !== 6) throw new Error(`SGP4 init error ${s.error}`);
    return s;
  }

  // Initialise from a CCSDS OMM record as served by CelesTrak (FORMAT=json). Needed for
  // catalog numbers above 99999, which have no TLE representation.
  function fromOMM(o) {
    const num = x => { const v = Number(x); if (!Number.isFinite(v)) throw new Error('bad OMM field'); return v; };
    const xpdotp = 1440 / twopi;
    const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d):(\d\d(?:\.\d+)?)/.exec(o.EPOCH || '');
    if (!m) throw new Error('bad OMM epoch');
    const day0 = Date.UTC(+m[1], +m[2] - 1, +m[3]);
    const frac = (+m[4] * 3600 + +m[5] * 60 + parseFloat(m[6])) / 86400; // keep sub-ms precision
    const s = {
      name: String(o.OBJECT_NAME || o.NORAD_CAT_ID).trim(), norad: String(o.NORAD_CAT_ID),
      ndot: num(o.MEAN_MOTION_DOT ?? 0) / (xpdotp * 1440),
      nddot: num(o.MEAN_MOTION_DDOT ?? 0) / (xpdotp * 1440 * 1440),
      bstar: num(o.BSTAR),
      inclo: num(o.INCLINATION) * pi / 180,
      nodeo: num(o.RA_OF_ASC_NODE) * pi / 180,
      ecco: num(o.ECCENTRICITY),
      argpo: num(o.ARG_OF_PERICENTER) * pi / 180,
      mo: num(o.MEAN_ANOMALY) * pi / 180,
      no_kozai: num(o.MEAN_MOTION) / xpdotp,
    };
    s.epochSgp4 = (day0 - Date.UTC(1949, 11, 31)) / 86400e3 + frac;
    s.epochMs = day0 + frac * 86400e3;
    init(s, s.epochSgp4);
    if (s.error && s.error !== 6) throw new Error(`SGP4 init error ${s.error}`);
    return s;
  }

  return { twoline, fromOMM, propagate, gstime, radiusearthkm };
})();


/* ============================================================
   Satellites
   SGP4/SDP4 (see SGP4 above) -> TEME -> ECEF by rotating through
   GMST (IAU-82, UTC used as UT1, polar motion ignored: < ~0.5 km)
   -> WGS-84 geodetic coordinates and topocentric look angles.
   Element sets are served statically as CCSDS OMM (JSON) from
   data/gp/<group>.json, fetched by scripts/fetch-data.mjs in the
   deploy workflow. The browser never calls CelesTrak. Pasted TLEs
   are parsed too.
   ============================================================ */
const EARTH = { Re: 6378.137, f: 1 / 298.257223563, omega: 7.292115e-5 }; // WGS-84, km, rad/s
// Groups are configured in site.config.json (tleGroups), fetch-data.mjs publishes the
// list as data/gp/groups.json. This default is only used if that file is missing.
const TLE_GROUPS_DEFAULT = [{ id: 'stations', label: 'Space stations' }, { id: 'amateur', label: 'Amateur' }, { id: 'weather', label: 'Weather' }];

// Land outlines: Natural Earth 1:110m (public domain), lat/lon in 0.1° units,
// delta-encoded, rings separated by ';'. Loaded on first visit to #satellites.
let landRings = null;
async function getLand() {
  if (landRings) return landRings;
  try {
    const r = await fetch('geo/land-110m.txt');
    if (!r.ok) throw new Error(r.status);
    landRings = (await r.text()).trim().split(';').map(ring => {
      const v = ring.split(',').map(Number), pts = [];
      let la = 0, lo = 0;
      for (let k = 0; k < v.length; k += 2) { la += v[k]; lo += v[k + 1]; pts.push([la / 10, lo / 10]); }
      return pts;
    });
  } catch (e) { landRings = []; }
  return landRings;
}

function parseTLE(text) {
  const lines = text.split(/\r?\n/).map(l => l.trimEnd()).filter(Boolean);
  const sats = [];
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith('1 ') && lines[i + 1]?.startsWith('2 ')) {
      const name = (i > 0 && !/^[12] /.test(lines[i - 1])) ? lines[i - 1].replace(/^0 /, '').trim() : lines[i].slice(2, 7).trim();
      try { sats.push(SGP4.twoline(name, lines[i], lines[i + 1])); } catch (e) {}
      i++;
    }
  }
  return sats;
}

function geodetic([x, y, z]) {
  const a = EARTH.Re, e2 = EARTH.f * (2 - EARTH.f);
  const p = Math.hypot(x, y);
  let lat = Math.atan2(z, p * (1 - e2)), N = a, alt = 0;
  for (let k = 0; k < 6; k++) {
    const s = Math.sin(lat);
    N = a / Math.sqrt(1 - e2 * s * s);
    alt = p / Math.cos(lat) - N;
    lat = Math.atan2(z, p * (1 - e2 * N / (N + alt)));
  }
  return { lat: lat / DEG, lon: Math.atan2(y, x) / DEG, alt };
}

function observerEcef(obs) {
  const a = EARTH.Re, e2 = EARTH.f * (2 - EARTH.f);
  const φ = obs.lat * DEG, λ = obs.lon * DEG, h = (obs.alt || 0) / 1e3;
  const N = a / Math.sqrt(1 - e2 * Math.sin(φ) ** 2);
  return [(N + h) * Math.cos(φ) * Math.cos(λ), (N + h) * Math.cos(φ) * Math.sin(λ), (N * (1 - e2) + h) * Math.sin(φ)];
}

// Satellite state at Unix time ms: ECEF position (km) and velocity (km/s), geodetic sub-point.
function satState(sat, ms) {
  const p = SGP4.propagate(sat, (ms - sat.epochMs) / 60e3);
  if (!p || sat.error === 6) return null;
  const g = SGP4.gstime(ms / 86400e3 + 2440587.5), c = Math.cos(g), s = Math.sin(g);
  const r = [c * p.r[0] + s * p.r[1], -s * p.r[0] + c * p.r[1], p.r[2]];
  const v = [c * p.v[0] + s * p.v[1] + EARTH.omega * r[1], -s * p.v[0] + c * p.v[1] - EARTH.omega * r[0], p.v[2]];
  return { r, v, ...geodetic(r) };
}

function lookAngles(obs, st) {
  const φ = obs.lat * DEG, λ = obs.lon * DEG;
  const o = observerEcef(obs);
  const d = st.r.map((v, k) => v - o[k]);
  const sφ = Math.sin(φ), cφ = Math.cos(φ), sλ = Math.sin(λ), cλ = Math.cos(λ);
  const e = -sλ * d[0] + cλ * d[1];
  const n = -sφ * cλ * d[0] - sφ * sλ * d[1] + cφ * d[2];
  const u = cφ * cλ * d[0] + cφ * sλ * d[1] + sφ * d[2];
  const range = Math.hypot(e, n, u);
  const rate = (d[0] * st.v[0] + d[1] * st.v[1] + d[2] * st.v[2]) / range; // km/s, observer fixed in ECEF
  return { az: (Math.atan2(e, n) / DEG + 360) % 360, el: Math.asin(u / range) / DEG, range, rate };
}

// Passes above minEl (deg) in [t0, t0 + hours]. Coarse 30 s scan, then bisection
// for AOS/LOS and golden-section search for the time of closest approach.
function predictPasses(sat, obs, t0, hours = 24, minEl = 0, max = 8) {
  const elAt = t => { const s = satState(sat, t); return s ? lookAngles(obs, s).el - minEl : NaN; };
  const step = 30e3, end = t0 + hours * 3600e3, passes = [];
  const edge = (a, b) => { // a below, b above (or vice versa): refine to 1 s
    const fa = elAt(a) > 0;
    while (b - a > 1e3) { const m = (a + b) / 2; (elAt(m) > 0) === fa ? a = m : b = m; }
    return (a + b) / 2;
  };
  let prev = elAt(t0), aos = prev > 0 ? t0 : null;
  if (!Number.isFinite(prev)) return { passes, error: true };
  for (let t = t0 + step; t <= end && passes.length < max; t += step) {
    const cur = elAt(t);
    if (!Number.isFinite(cur)) return { passes, error: true };
    if (prev <= 0 && cur > 0) aos = edge(t - step, t);
    if (prev > 0 && cur <= 0 && aos !== null) {
      const los = edge(t - step, t);
      let a = aos, b = los;
      const gr = (Math.sqrt(5) - 1) / 2;
      while (b - a > 1e3) {
        const m1 = b - gr * (b - a), m2 = a + gr * (b - a);
        elAt(m1) > elAt(m2) ? b = m2 : a = m1;
      }
      const tca = (a + b) / 2, st = satState(sat, tca), la = lookAngles(obs, st);
      const azAt = t => lookAngles(obs, satState(sat, t)).az;
      passes.push({ aos, los, tca, maxEl: la.el, aosAz: azAt(aos), losAz: azAt(los), partial: aos === t0 });
      aos = null;
    }
    prev = cur;
  }
  // Still above minEl at the end of the window (or for all of it: GEO, HEO near apogee).
  if (aos !== null && passes.length < max) {
    passes.push({ aos, los: null, tca: null, maxEl: null, aosAz: lookAngles(obs, satState(sat, aos)).az, partial: aos === t0, always: aos === t0 && passes.length === 0 });
  }
  return { passes };
}

const utc = (ms, withDate = true) => {
  const s = new Date(ms).toISOString();
  return withDate ? `${s.slice(5, 10)} ${s.slice(11, 19)}` : s.slice(11, 19);
};
