          <button class="btn ghost" id="tleload" type="button" style="margin-top:8px">Load</button>
        </details>
      </div>
    </div>`;

  let sats = [], cur = null, timer = null, track = null, passTimer = null, groups = TLE_GROUPS_DEFAULT;
  try { const g = await fetchJSON('data/gp/groups.json'); if (Array.isArray(g) && g.length) groups = g; } catch (e) {}
  const lastGroup = store('fn-sat-group');
  $('#grp').innerHTML = groups.map(g => `<option value="${h(g.id)}"${g.id === lastGroup ? ' selected' : ''}>${h(g.label)}${g.count ? ` (${g.count})` : ''}</option>`).join('');
  const canvas = $('#map'), ctx = canvas.getContext('2d');
  const cs = () => getComputedStyle(document.documentElement);
  const savePrefs = () => store('fn-sat-prefs', prefs);

  const fillSats = () => {
    // Last chosen satellite, else the ISS, else the first in the list.
    const want = String(store('fn-sat-norad') ?? '');
    let k0 = sats.findIndex(s => s.norad === want);
    if (k0 < 0) k0 = Math.max(0, sats.findIndex(s => s.norad === '25544'));
    $('#sat').innerHTML = sats.map((s, k) => `<option value="${k}"${k === k0 ? ' selected' : ''}>${h(s.name)} (${s.norad})</option>`).join('');
    cur = sats[k0] || null;
    track = null;
  };

  async function loadGroup(g) {
    $('#tleinfo').textContent = 'Loading…';
    try {
      const list = await fetchJSON(`data/gp/${g}.json`);
      sats = [];
      for (const o of list) { try { sats.push(SGP4.fromOMM(o)); } catch (e) {} }
      sats.sort((a, b) => a.name.localeCompare(b.name));
      if (!sats.length) throw new Error('empty');
      const meta = groups.find(x => x.id === g);
      $('#tleinfo').textContent = meta?.stale ? 'CelesTrak was unreachable at the last refresh, these are the previous element sets.' : '';
    } catch (e) {
      sats = [];
      $('#tleinfo').textContent = `No data/gp/${g}.json available. Run node scripts/fetch-data.mjs locally, or paste a TLE below.`;
    }
    fillSats();
  }

  function buildTrack(now) {
    const T = 2 * Math.PI / cur.no_kozai * 60e3; // ms per revolution
    const pts = [];
    for (let t = -T; t <= T; t += T / 240) {
      const s = satState(cur, now + t);
      pts.push(s ? [t, s.lat, s.lon] : null);
    }
    track = { t0: now, pts };
  }

  function drawMap(now, st) {
    const W = canvas.width, H = canvas.height, s = cs();
    const ink = s.getPropertyValue('--screen-ink').trim(), grid = s.getPropertyValue('--screen-grid').trim();
    ctx.fillStyle = s.getPropertyValue('--screen').trim();
    ctx.fillRect(0, 0, W, H);
    const P = (lat, lon) => [(lon + 180) / 360 * W, (90 - lat) / 180 * H];
    const line = (pts, close) => { // polyline in lon/lat with antimeridian breaks
      ctx.beginPath();
      let prev = null;
      for (const p of pts) {
        if (!p) { prev = null; continue; }
        const [x, y] = P(p[0], p[1]);
        if (prev === null || Math.abs(p[1] - prev) > 180) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        prev = p[1];
      }
      if (close) ctx.closePath();
      ctx.stroke();
    };
    // land outlines
    ctx.strokeStyle = s.getPropertyValue('--screen-land').trim(); ctx.lineWidth = 1.5;
    for (const ring of landRings || []) line(ring);
    // graticule
    ctx.strokeStyle = grid; ctx.lineWidth = 1;
    for (let lon = -180; lon <= 180; lon += 30) { const x = (lon + 180) / 360 * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let lat = -90; lat <= 90; lat += 30) { const y = (90 - lat) / 180 * H; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // observer
    const [ox, oy] = P(obs.lat, obs.lon);
    ctx.strokeStyle = '#f5c46b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ox - 10, oy); ctx.lineTo(ox + 10, oy); ctx.moveTo(ox, oy - 10); ctx.lineTo(ox, oy + 10); ctx.stroke();
    if (!cur || !st) return;
    if (!track || Math.abs(now - track.t0) > 30e3) buildTrack(now);
    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    const shift = now - track.t0;
    for (const [past, alpha] of [[true, 0.35], [false, 1]]) {
      ctx.globalAlpha = alpha;
      line(track.pts.map(p => p && ((p[0] - shift < 0) === past) ? [p[1], p[2]] : null));
    }
    ctx.globalAlpha = 1;
    // footprint: small circle of angular radius acos(Re / (Re + h)) around the sub-point
    const lam = Math.acos(EARTH.Re / (EARTH.Re + Math.max(st.alt, 0)));
    const φ0 = st.lat * DEG, λ0 = st.lon * DEG, fp = [];
    for (let k = 0; k <= 180; k++) {
      const b = k / 180 * 2 * Math.PI;
      const φ = Math.asin(Math.sin(φ0) * Math.cos(lam) + Math.cos(φ0) * Math.sin(lam) * Math.cos(b));
      const λ = λ0 + Math.atan2(Math.sin(b) * Math.sin(lam) * Math.cos(φ0), Math.cos(lam) - Math.sin(φ0) * Math.sin(φ));
      fp.push([φ / DEG, ((λ / DEG + 540) % 360) - 180]);
    }
    ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5; line(fp); ctx.setLineDash([]);
    const [x, y] = P(st.lat, st.lon);
    ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(x, y, 8, 0, 2 * Math.PI); ctx.fill();
    ctx.font = '22px ui-monospace, monospace';
    ctx.fillText(cur.name, Math.min(x + 14, W - 260), Math.max(y - 12, 24));
  }

  function drawPasses() {
    const tb = $('#passes');
    if (!cur) { tb.innerHTML = '<tr><td colspan="6" class="muted">No satellite.</td></tr>'; return; }
    const minEl = Number.isFinite(prefs.minEl) ? prefs.minEl : 0;
    const { passes, error } = predictPasses(cur, obs, Date.now(), 24, minEl);
    if (error && !passes.length) { tb.innerHTML = '<tr><td colspan="6" class="muted">Propagation failed (decayed object or bad TLE).</td></tr>'; return; }
    if (!passes.length) { tb.innerHTML = `<tr><td colspan="6" class="muted">No passes above ${fmt(minEl, 0)}° in the next 24 h.</td></tr>`; return; }
    tb.innerHTML = passes.map(p => p.always
      ? `<tr><td colspan="6">Above ${fmt(minEl, 0)}° for the whole 24 h window (geostationary or near).</td></tr>`
      : `<tr>
        <td class="freq">${p.partial ? 'in progress' : utc(p.aos)}</td>
        <td class="freq">${p.maxEl === null ? '-' : fmt(p.maxEl, 1) + '°'}</td>
        <td class="freq">${p.tca ? utc(p.tca, false) : '-'}</td>
        <td class="freq">${p.los ? utc(p.los, false) : '-'}</td>
        <td class="freq">${p.los ? `${Math.floor((p.los - p.aos) / 60e3)}:${String(Math.round((p.los - p.aos) / 1e3) % 60).padStart(2, '0')}` : '-'}</td>
        <td class="freq">${fmt(p.aosAz, 0)}° → ${p.los ? fmt(p.losAz, 0) + '°' : '-'}</td></tr>`).join('');
  }

  function tick() {
    const now = Date.now();
    $('#clock').textContent = utc(now, false) + ' UTC';
    const st = cur ? satState(cur, now) : null;
    drawMap(now, st);
    if (!cur) { $('#now').innerHTML = '<dt>-</dt><dd>no satellite</dd>'; $('#dop').innerHTML = ''; return; }
    if (!st) { $('#now').innerHTML = `<dt>⚠</dt><dd class="draft-badge">SGP4 error ${cur.error} (decayed?)</dd>`; $('#dop').innerHTML = ''; return; }
    const la = lookAngles(obs, st);
    const age = (now - cur.epochMs) / 86400e3;
    $('#now').innerHTML = [
      ['Lat', `${fmt(st.lat, 2)}°`], ['Lon', `${fmt(st.lon, 2)}°`], ['Alt', `${fmt(st.alt, 0)} km`],
      ['Az', `${fmt(la.az, 1)}°`], ['El', `${fmt(la.el, 1)}°${la.el > 0 ? ' ▲' : ''}`], ['Range', `${fmt(la.range, 0)} km`],
      ['Range rate', `${fmt(la.rate, 3)} km/s`],
      ['Elements age', `${fmt(age, 1)} d`],
    ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') + (age > 7 ? '<dt class="draft-badge">⚠</dt><dd class="draft-badge">stale elements</dd>' : '');
    const f = prefs.dl;
    if (Number.isFinite(f)) {
      const df = -f * 1e6 * la.rate * 1e3 / C0;
      $('#dop').innerHTML = `<dt>Doppler</dt><dd>${df >= 0 ? '+' : ''}${fmt(df / 1e3, 3)} kHz</dd><dt>Receive on</dt><dd>${(f + df / 1e6).toFixed(6)} MHz</dd>`;
    } else $('#dop').innerHTML = '';
  }

  const refresh = () => { track = null; tick(); drawPasses(); };

  view.addEventListener('change', e => {
    if (e.target.id === 'grp') { store('fn-sat-group', e.target.value); loadGroup(e.target.value).then(refresh); }
    if (e.target.id === 'sat') { cur = sats[+e.target.value] || null; if (cur) store('fn-sat-norad', cur.norad); refresh(); }
  });
  view.addEventListener('input', e => {
    const id = e.target.id;
    if (['olat', 'olon', 'oalt'].includes(id)) {
      const v = { lat: parseFloat($('#olat').value), lon: parseFloat($('#olon').value), alt: parseFloat($('#oalt').value) || 0 };
      if (Number.isFinite(v.lat) && Number.isFinite(v.lon) && Math.abs(v.lat) <= 90) {
        Object.assign(obs, v); store('fn-observer', obs);
        clearTimeout(passTimer); passTimer = setTimeout(drawPasses, 400);
      }
    }
    if (id === 'minel') { prefs.minEl = parseFloat(e.target.value); savePrefs(); clearTimeout(passTimer); passTimer = setTimeout(drawPasses, 400); }
    if (id === 'dl') { prefs.dl = parseFloat(e.target.value); savePrefs(); tick(); }
  });
  $('#geo')?.addEventListener('click', () => {
    navigator.geolocation.getCurrentPosition(p => {
      $('#olat').value = p.coords.latitude.toFixed(4);
      $('#olon').value = p.coords.longitude.toFixed(4);
      if (Number.isFinite(p.coords.altitude)) $('#oalt').value = Math.round(p.coords.altitude);
      $('#olat').dispatchEvent(new Event('input', { bubbles: true }));
    }, err => { $('#tleinfo').textContent = `Location unavailable: ${err.message}`; }, { timeout: 10e3 });
  });
  $('#tleload').addEventListener('click', () => {
    const extra = parseTLE($('#tlepaste').value);
    if (extra.length) { sats = extra; fillSats(); $('#tleinfo').textContent = ''; refresh(); }
    else $('#tleinfo').textContent = 'Could not parse that TLE.';
  });

  await Promise.all([loadGroup($('#grp').value), getLand()]);
  refresh();
  timer = setInterval(tick, 1000);
  const passInterval = setInterval(drawPasses, 60e3);
  return () => { clearInterval(timer); clearInterval(passInterval); clearTimeout(passTimer); };
});

/* ============================================================
   Propagation
   Live data come from data/propagation.json, written by
   scripts/fetch-data.mjs in the deploy workflow (every 3 h). Shape:
   { updated, stale?, kp, kpTime, kpSeries: [{ time, kp, kind }],
     sfi, sfiTime, sfi90,
     scales: { time, now: { R, S, G }, days: [{ date, rMinor, rMajor, s, g }] },
     xray: { flux, time, peak, peakTime, series: [[iso, flux]] },
     wind: { time, bz, bt, speed, density, series: [[iso, bz, bt, speed, density]] },
     ionosondes: [{ station, code, lat, lon, foF2, hmF2, mufd, cs, time }],
     ionoHistory: { CODE: [[iso, foF2, mufd]] }, sources }
   ============================================================ */

// NOAA space weather G-scale from planetary Kp (Kp 9- counts as G4).
const gScale = kp => !Number.isFinite(kp) || kp < 4.5 ? null : kp >= 9 ? 5 : Math.min(4, Math.round(kp) - 4);
const SCALE_TEXT = ['none', 'minor', 'moderate', 'strong', 'severe', 'extreme'];

// GOES 0.1-0.8 nm flux (W/m²) to flare class, e.g. 3.2e-6 -> "C3.2".
function xrayClass(f) {
  if (!Number.isFinite(f) || f <= 0) return '-';
  const cls = [['X', 1e-4], ['M', 1e-5], ['C', 1e-6], ['B', 1e-7], ['A', 1e-8]];
  for (const [c, b] of cls) if (f >= b) return `${c}${(f / b).toFixed(1)}`;
  return `A${(f / 1e-8).toFixed(1)}`;
}

// Maidenhead locator <-> lat/lon (centre of the square or subsquare).
function toLocator(lat, lon) {
  const x = Math.min(Math.max(lon + 180, 0), 359.9999), y = Math.min(Math.max(lat + 90, 0), 179.9999);
  const A = 'ABCDEFGHIJKLMNOPQR', a = 'abcdefghijklmnopqrstuvwx';
  return A[Math.floor(x / 20)] + A[Math.floor(y / 10)] + Math.floor((x % 20) / 2) + Math.floor(y % 10) +
    a[Math.floor((x % 2) * 12)] + a[Math.floor((y % 1) * 24)];
}
function parsePlace(text) {
  const t = String(text || '').trim();
  let m = /^([A-R]{2})(\d{2})([A-X]{2})?$/i.exec(t);
  if (m) {
    const f = m[1].toUpperCase(), s = m[2], sub = m[3] ? m[3].toLowerCase() : null;
    let lon = (f.charCodeAt(0) - 65) * 20 - 180 + +s[0] * 2;
    let lat = (f.charCodeAt(1) - 65) * 10 - 90 + +s[1];
    if (sub) { lon += (sub.charCodeAt(0) - 97) / 12 + 1 / 24; lat += (sub.charCodeAt(1) - 97) / 24 + 1 / 48; }
    else { lon += 1; lat += 0.5; }
    return { lat, lon };
  }
  m = /^(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)$/.exec(t);
  if (m && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180) return { lat: +m[1], lon: +m[2] };
  return null;
}

// Great circle helpers (spherical Earth, mean radius).
const R_MEAN = 6371;
function gcDistance(a, b) {
  const φ1 = a.lat * DEG, φ2 = b.lat * DEG, dφ = φ2 - φ1, dλ = (b.lon - a.lon) * DEG;
  const s = Math.sin(dφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dλ / 2) ** 2;
  return 2 * R_MEAN * Math.asin(Math.min(1, Math.sqrt(s)));
}
function gcPoint(a, b, f) { // fraction f along the great circle from a to b
  const φ1 = a.lat * DEG, λ1 = a.lon * DEG, φ2 = b.lat * DEG, λ2 = b.lon * DEG;
  const d = gcDistance(a, b) / R_MEAN;
  if (d < 1e-9) return { lat: a.lat, lon: a.lon };
  const A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
  const x = A * Math.cos(φ1) * Math.cos(λ1) + B * Math.cos(φ2) * Math.cos(λ2);
  const y = A * Math.cos(φ1) * Math.sin(λ1) + B * Math.cos(φ2) * Math.sin(λ2);
  const z = A * Math.sin(φ1) + B * Math.sin(φ2);
  return { lat: Math.atan2(z, Math.hypot(x, y)) / DEG, lon: Math.atan2(y, x) / DEG };
}

// Mirror-reflection geometry for one hop of ground length D (km) at virtual height h (km).
function hopGeometry(D, h) {
  const R = R_MEAN, th = D / (2 * R);
  const AP = Math.sqrt(R * R + (R + h) ** 2 - 2 * R * (R + h) * Math.cos(th));
  const phi = Math.asin(R * Math.sin(th) / AP);
  const elev = Math.atan2((R + h) * Math.cos(th) - R, (R + h) * Math.sin(th)) / DEG;
  return { sec: 1 / Math.cos(phi), elev };
}

// MUF for one hop of length D, anchored on the two values an ionosonde measures:
// foF2 (vertical incidence, D = 0) and MUF(3000)F2. In between and beyond, the
// secant-law shape for a layer at hmF2 interpolates and extrapolates.
function hopMuf(st, D) {
  const h = st.hmF2 || 300;
  if (!Number.isFinite(st.mufd)) return st.foF2 * hopGeometry(D, h).sec; // plain secant law
  const s3000 = hopGeometry(3000, h).sec, sD = hopGeometry(D, h).sec;
  const M = st.mufd / st.foF2;
  return st.foF2 * (1 + (M - 1) * (sD - 1) / (s3000 - 1));
}

// Sun: low precision ephemeris (Astronomical Almanac), about 0.01° in position.
function subsolar(ms) {
  const n = ms / 86400e3 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474 * n) * DEG, g = (357.528 + 0.9856003 * n) * DEG;
  const lam = L + (1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * DEG;
  const eps = (23.439 - 0.0000004 * n) * DEG;
  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
  const gmstDeg = 280.46061837 + 360.98564736629 * n;
  const lon = ((ra / DEG - gmstDeg) % 360 + 540) % 360 - 180;
  return { lat: dec / DEG, lon };
}
const sunElevation = (ss, lat, lon) => Math.asin(Math.sin(lat * DEG) * Math.sin(ss.lat * DEG) +
  Math.cos(lat * DEG) * Math.cos(ss.lat * DEG) * Math.cos((lon - ss.lon) * DEG)) / DEG;

// Amateur HF bands, ITU Region 1, with a representative frequency for the estimate.
const HF_BANDS = [
  ['160 m', 1.84], ['80 m', 3.6], ['60 m', 5.36], ['40 m', 7.1], ['30 m', 10.12],
  ['20 m', 14.15], ['17 m', 18.1], ['15 m', 21.2], ['12 m', 24.94], ['10 m', 28.5],
];

/* ---------- small SVG charts with a hover read-out ---------- */
const tFmt = ms => new Date(ms).toISOString().slice(5, 16).replace('T', ' ');

// series: [{ name, cls, pts: [[ms, value|null]] }]. One y axis (all series share a unit).
function lineChart(el, { series, yLog = false, yMin, yMax, ticks, tickFmt = String, unit = '', vFmt = v => fmt(v, 1), guides = [], height = 200 }) {
  const W = 460, H = height, top = 12, bottom = 22, left = 44, right = 12;
  const all = series.flatMap(s => s.pts).filter(p => p[1] !== null && Number.isFinite(p[1]));
  if (!all.length) { el.innerHTML = '<p class="muted small">No data.</p>'; return; }
  const t0 = Math.min(...all.map(p => p[0])), t1 = Math.max(...all.map(p => p[0]));
  const fy = v => yLog ? Math.log10(v) : v;
  const lo = fy(yMin ?? Math.min(...all.map(p => p[1]))), hi = fy(yMax ?? Math.max(...all.map(p => p[1])));
  const X = t => left + (t - t0) / Math.max(1, t1 - t0) * (W - left - right);
  const Y = v => top + (1 - (fy(v) - lo) / ((hi - lo) || 1)) * (H - top - bottom);
  const grid = (ticks || []).map(v => `<line x1="${left}" x2="${W - right}" y1="${Y(v)}" y2="${Y(v)}" class="ch-grid"/>
    <text x="${left - 6}" y="${Y(v) + 3}" text-anchor="end" class="ch-ax">${tickFmt(v)}</text>`).join('');
  const gl = guides.map(g => `<line x1="${left}" x2="${W - right}" y1="${Y(g.v)}" y2="${Y(g.v)}" class="ch-guide"/>
    <text x="${W - right - 2}" y="${Y(g.v) - 4}" text-anchor="end" class="ch-ax">${h(g.label)}</text>`).join('');
  const days = [];
  for (let d = Math.ceil(t0 / 86400e3) * 86400e3; d <= t1; d += 86400e3) {
    days.push(`<line x1="${X(d)}" x2="${X(d)}" y1="${top}" y2="${H - bottom}" class="ch-grid"/><text x="${X(d) + 3}" y="${H - 6}" class="ch-ax">${new Date(d).toISOString().slice(5, 10)}</text>`);
  }
  const paths = series.map(s => {
    let d = '', pen = false;
    for (const [t, v] of s.pts) {
      if (v === null || !Number.isFinite(v) || (yLog && v <= 0)) { pen = false; continue; }
      const yv = Math.min(Math.max(Y(v), top), H - bottom);
      d += `${pen ? 'L' : 'M'}${X(t).toFixed(1)},${yv.toFixed(1)}`;
      pen = true;
    }
    return `<path d="${d}" class="ch-line ${s.cls}"/>`;
  }).join('');
  const legend = series.length > 1 ? `<div class="ch-legend">${series.map(s => `<span><i class="${s.cls}"></i>${h(s.name)}</span>`).join('')}</div>` : '';
  el.innerHTML = `${legend}<div class="ch-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${h(series.map(s => s.name).join(', '))}, last ${Math.round((t1 - t0) / 3600e3)} h">
    ${grid}${gl}${days.join('')}${paths}
    <line class="ch-cross" x1="0" x2="0" y1="${top}" y2="${H - bottom}" style="display:none"/>
    <rect x="${left}" y="${top}" width="${W - left - right}" height="${H - top - bottom}" fill="transparent" class="ch-hit"/>
  </svg><div class="ch-tip" style="display:none"></div></div>`;
  const svg = $('svg', el), cross = $('.ch-cross', el), tip = $('.ch-tip', el);
  svg.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W;
    const t = t0 + (x - left) / (W - left - right) * (t1 - t0);
    const rows = series.map(s => {
      let best = null;
      for (const p of s.pts) if (p[1] !== null && (!best || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p;
      return best && `<div><i class="${s.cls}"></i>${h(s.name)} <b>${h(vFmt(best[1]))}</b> ${h(unit)}</div>`;
    }).filter(Boolean);
    const near = series[0].pts.reduce((b, p) => (!b || Math.abs(p[0] - t) < Math.abs(b[0] - t) ? p : b), null);
    cross.setAttribute('x1', X(near[0])); cross.setAttribute('x2', X(near[0])); cross.style.display = '';
    tip.innerHTML = `<div class="mono">${tFmt(near[0])} UTC</div>${rows.join('')}`;
    tip.style.display = '';
    const px = X(near[0]) / W * r.width;
    tip.style.left = `${Math.min(Math.max(px + 10, 0), r.width - 170)}px`;
  });
  svg.addEventListener('mouseleave', () => { cross.style.display = 'none'; tip.style.display = 'none'; });
}

// Kp: observed bars solid, estimated and predicted bars outlined, a line at "now".
function kpChart(list) {
  const W = 460, H = 180, top = 14, bottom = 22, left = 26;
  const n = list.length, bw = (W - left) / n, y = v => H - bottom - v / 9 * (H - top - bottom);
  const now = Date.now();
  let nowX = null;
  const bars = list.map((r, i) => {
    const x = left + i * bw + 1, g = gScale(r.kp), y0 = y(Math.max(r.kp, 0.15));
    const t = Date.parse(r.time);
    if (now >= t && now < t + 3 * 3600e3) nowX = left + (i + (now - t) / (3 * 3600e3)) * bw;
    const fut = r.kind !== 'observed';
    const cls = `${g ? 'kp-storm' : 'kp-quiet'}${fut ? ' kp-fut' : ''}`;
    return `<g><title>${tFmt(t)} UTC - Kp ${fmt(r.kp, 2)} (${r.kind})${g ? ` - G${g} storm` : ''}</title>
      <rect x="${x}" y="${top}" width="${bw - 2}" height="${H - top - bottom}" fill="transparent"/>
      <path d="M${x},${H - bottom} V${y0 + 3} q0,-3 3,-3 h${Math.max(bw - 8, 0)} q3,0 3,3 V${H - bottom} Z" class="${cls}"/>
      ${g ? `<text x="${x + (bw - 2) / 2}" y="${y0 - 4}" text-anchor="middle" class="kp-lbl">G${g}</text>` : ''}</g>`;
  }).join('');
  const grid = [0, 3, 5, 9].map(v => `<line x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="${v === 5 ? 'ch-guide' : 'ch-grid'}"/>
    <text x="${left - 6}" y="${y(v) + 3}" text-anchor="end" class="ch-ax">${v}</text>`).join('');
  const days = list.map((r, i) => r.time.slice(11, 13) === '00'
    ? `<line x1="${left + i * bw}" x2="${left + i * bw}" y1="${top}" y2="${H - bottom}" class="ch-grid"/><text x="${left + i * bw + 3}" y="${H - 6}" class="ch-ax">${r.time.slice(5, 10)}</text>` : '').join('');
  const nowLine = nowX ? `<line x1="${nowX}" x2="${nowX}" y1="${top - 6}" y2="${H - bottom}" class="ch-now"/><text x="${nowX + 4}" y="${top}" class="ch-ax">now</text>` : '';
  return `<div class="ch-legend"><span><i class="kp-quiet"></i>observed</span><span><i class="kp-quiet kp-fut"></i>estimated / forecast</span><span><i class="kp-storm"></i>storm (Kp ≥ 5)</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Planetary Kp, last 48 hours and 3-day forecast">${grid}${days}${bars}${nowLine}</svg>`;
}

function sparkline(pts) {
  const W = 120, H = 30, p = pts.filter(x => Number.isFinite(x[1]));
  if (!p.length) return '';
  const t0 = Date.parse(p[0][0]), t1 = Date.now(), t0w = t1 - 36 * 3600e3;
  const vs = p.map(x => x[1]), lo = Math.min(...vs) * 0.9, hi = Math.max(...vs) * 1.1 || 1;
  const X = t => 2 + (Date.parse(t) - t0w) / (t1 - t0w) * (W - 4), Y = v => H - 3 - (v - lo) / ((hi - lo) || 1) * (H - 6);
  const d = p.map((x, i) => `${i ? 'L' : 'M'}${X(x[0]).toFixed(1)},${Y(x[1]).toFixed(1)}`).join('');
  const last = p[p.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" role="img" aria-label="foF2 over the last 36 hours, ${p.length} samples"><title>${p.length} samples since ${tFmt(t0)} UTC</title>
    <path d="${d}" class="ch-line s1"/><circle cx="${X(last[0])}" cy="${Y(last[1])}" r="2.5" class="spark-dot"/></svg>`;
}

  // foF2 colour scale: one hue (amber, light = high), domain fitted to the current values
  // so that a quiet night with every station near 3 MHz is still readable. Numbers are

  const fos = list.map(s => s.foF2);

  const foColor = f => { const u = Math.min(Math.max((f - foMin) / (foMax - foMin), 0), 1); return `color-mix(in oklab, var(--fo-hi) ${Math.round(u * 100)}%, var(--fo-lo))`; };
  // Sun shading over the dark map, shared by the canvas and the legend swatches.
  const SHADE = { day: 'rgba(255, 255, 255, 0.08)', twi: 'rgba(150, 175, 255, 0.30)', dusk: 'rgba(0, 0, 0, 0.22)', night: 'rgba(0, 0, 0, 0.45)' };

    const cv = $('#pmap'), ctx = cv.getContext('2d'), s = getComputedStyle(document.documentElement);

    ctx.fillStyle = s.getPropertyValue('--screen').trim();
    ctx.fillRect(0, 0, MAP.W, MAP.H);
    // day / twilight / night, per 10 px cell
    const cell = 10;
    for (let py = 0; py < MAP.H; py += cell) {
      const lat = MAP.lat1 - (py + cell / 2) / MAP.H * (MAP.lat1 - MAP.lat0);
      for (let px = 0; px < MAP.W; px += cell) {
        const lon = MAP.lon0 + (px + cell / 2) / MAP.W * (MAP.lon1 - MAP.lon0);
        const el = sunElevation(ss, lat, lon);
        ctx.fillStyle = el > 0 ? SHADE.day : el > -6 ? SHADE.twi : el > -12 ? SHADE.dusk : SHADE.night;
        ctx.fillRect(px, py, cell, cell);
      }
    }
    // land
    ctx.strokeStyle = s.getPropertyValue('--screen-land').trim(); ctx.lineWidth = 1.6;
    for (const ring of landRings || []) {
      ctx.beginPath(); let pen = false, prev = null;
      for (const [la, lo] of ring) {
        const x = MX(lo), y = MY(la);
        if (!pen || Math.abs(lo - prev) > 180) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        pen = true; prev = lo;
      }
      ctx.stroke();
    }
    // graticule
    ctx.strokeStyle = s.getPropertyValue('--screen-grid').trim(); ctx.lineWidth = 1;
    for (let lo = -20; lo <= 40; lo += 10) { ctx.beginPath(); ctx.moveTo(MX(lo), 0); ctx.lineTo(MX(lo), MAP.H); ctx.stroke(); }
    for (let la = 30; la <= 70; la += 10) { ctx.beginPath(); ctx.moveTo(0, MY(la)); ctx.lineTo(MAP.W, MY(la)); ctx.stroke(); }

    // overlay: stations first, then the path and markers on top so nothing hides them
    let o = '';
    for (const st of list) {
      const sel = path && path.st === st;
      o += `<g class="map-st${sel ? ' sel' : ''}"><title>${h(st.station)}: foF2 ${fmt(st.foF2, 2)} MHz${st.mufd ? `, MUF(3000) ${fmt(st.mufd, 1)} MHz` : ''}, ${t(st.time)} UTC${sel ? ' (used for the path)' : ''}</title>
        <circle cx="${MX(st.lon)}" cy="${MY(st.lat)}" r="${sel ? 16 : 13}" style="fill:${foColor(st.foF2)}"/>
        <text x="${MX(st.lon) + 19}" y="${MY(st.lat) + 8}" class="map-lbl">${fmt(st.foF2, 1)}</text></g>`;
    }
    if (path) {
      const pts = [];
      for (let k = 0; k <= 64; k++) pts.push(gcPoint(path.a, path.b, k / 64));
      o += `<polyline points="${pts.map(p => `${MX(p.lon).toFixed(1)},${MY(p.lat).toFixed(1)}`).join(' ')}" class="map-path"/>`;
      for (const r of path.refl) o += `<circle cx="${MX(r.lon)}" cy="${MY(r.lat)}" r="8" class="map-refl"><title>Reflection point</title></circle>`;
      const dx = MX(path.b.lon), dy = MY(path.b.lat);
      o += `<g class="map-dest"><title>Destination ${h(toLocator(path.b.lat, path.b.lon))}</title><path d="M${dx},${dy - 13} l13,13 l-13,13 l-13,-13 z"/><text x="${dx - 18}" y="${dy + 8}" text-anchor="end" class="map-tag">dest</text></g>`;
    }
    const ox = MX(obs.lon), oy = MY(obs.lat);
    o += `<g class="map-obs"><title>You: ${h(toLocator(obs.lat, obs.lon))}</title><path d="M${ox - 15},${oy} h30 M${ox},${oy - 15} v30"/><text x="${ox - 20}" y="${oy + 8}" text-anchor="end" class="map-tag">you</text></g>`;
    $('#pmap-over').innerHTML = o;
    $('#mapclock').textContent = `${tFmt(now)} UTC`;
    const sw = c => `background: linear-gradient(${c}, ${c}), var(--screen)`;
    $('#mapkey').innerHTML = `<span class="key-group">foF2 <span class="mono">${fmt(foMin, 1)}</span><span class="key-ramp"></span><span class="mono">${fmt(foMax, 1)} MHz</span></span>
      <span><i class="key-sw" style="${sw(SHADE.day)}"></i>day</span><span><i class="key-sw" style="${sw(SHADE.twi)}"></i>grey line (sun 0° to -6°)</span><span><i class="key-sw" style="${sw(SHADE.night)}"></i>night</span>
      <span><b class="key-x">+</b>you</span>${path ? '<span><b class="key-x">◆</b>destination</span><span><i class="key-sw path"></i>path, ○ reflection points</span>' : ''}`;
  }

  function bandsAndPath() {
    const near = nearest(obs);
    const ss = subsolar(Date.now()), sunEl = sunElevation(ss, obs.lat, obs.lon), day = sunEl > 0;
    // Bands
    if (!near) { $('#bands').innerHTML = '<tr><td colspan="4" class="muted">No ionosonde data.</td></tr>'; $('#bands-src').textContent = ''; }
    else {
      const st = near.s, mufNv = st.foF2, mufDx = Number.isFinite(st.mufd) ? st.mufd : hopMuf(st, 3000);
      $('#bands-src').innerHTML = `Nearest ionosonde: <b>${h(String(st.station).replace(` ${st.code}`, ''))}</b>, ${fmt(near.km, 0)} km away, ${t(st.time)} UTC. foF2 ${fmt(st.foF2, 2)} MHz, MUF(3000) ${fmt(mufDx, 1)} MHz. Sun ${day ? 'up' : 'down'} at your location (${fmt(sunEl, 0)}°).${near.km > 800 ? ' <span class="draft-badge">⚠ far away, take it with a pinch of salt</span>' : ''}`;
      const cellFor = (f, muf, band) => {
        if (band === '160 m' && day) return '<span class="st st-abs">▼ absorbed</span>';
        if (f <= 0.85 * muf) return '<span class="st st-open">● open</span>';
        if (f <= muf) return '<span class="st st-marg">◐ marginal</span>';
        return '<span class="st st-closed">○ closed</span>';
      };
      $('#bands').innerHTML = HF_BANDS.map(([b, f]) => `<tr><td>${b}</td><td class="freq">${f}</td><td>${cellFor(f, mufNv, b)}</td><td>${cellFor(f, mufDx, b)}</td></tr>`).join('');
    }
    // Path
    const dest = resolvePlace('m-to');
    if (!dest || !list.length) {
      $('#m-out').innerHTML = `<div class="row"><span class="warn">${!list.length ? 'No ionosonde data.' : 'Enter a locator (e.g. IO91wm) or lat, lon (e.g. 51.5, -0.1).'}</span></div>`;
      drawMap(null);
      return;
    }
    const D = gcDistance(obs, dest), mid = gcPoint(obs, dest, 0.5);
    const pick = $('#m-st').value;
    const stInfo = pick === '' ? nearest(mid) : { s: list[+pick], km: gcDistance(mid, list[+pick]) };
    const st = stInfo.s, hgt = st.hmF2 || 300;
    let hops = 1;
    while (hopGeometry(D / hops, hgt).elev < 3 && hops < 20) hops++;
    const Dh = D / hops, g = hopGeometry(Dh, hgt);
    const muf = hopMuf(st, Dh), fot = 0.85 * muf;
    const best = [...HF_BANDS].reverse().find(([, f]) => f <= fot);
    const refl = Array.from({ length: hops }, (_, k) => gcPoint(obs, dest, (2 * k + 1) / (2 * hops)));
    const rows = [
      { k: 'Distance', v: `${fmt(D, 0)} km` },
      { k: 'Hops', v: `${hops} × ${fmt(Dh, 0)} km` },
      { k: 'Take-off elevation', v: `${fmt(g.elev, 1)}°` },
      { k: 'Ionosonde used', v: `${st.code}, ${fmt(stInfo.km, 0)} km from midpoint` },
      { k: 'MUF', v: `${fmt(muf, 1)} MHz` },
      { k: 'FOT (0.85 × MUF)', v: `${fmt(fot, 1)} MHz` },
      { k: 'Highest open band', v: best ? `${best[0]} (${best[1]} MHz)` : 'none above 160 m' },
    ];
    if (D < 50) rows.push({ k: 'Note', v: 'very short path: use the NVIS column', warn: true });
    if (stInfo.km > 1000) rows.push({ k: 'Note', v: 'no ionosonde near the midpoint, low confidence', warn: true });
    if (hops > 1) rows.push({ k: 'Note', v: 'multi-hop: each hop sees a different ionosphere, the worst one limits the path', warn: true });
    $('#m-out').innerHTML = rows.map(r => `<div class="row"><span class="k">${h(r.k)}</span><span class="${r.warn ? 'warn' : 'v'}">${h(r.v)}</span></div>`).join('');
    drawMap({ a: obs, b: dest, refl, st });
  }

  // Location and destination: a preset, or the custom text field.
  function resolvePlace(id) {
    const key = $(`#${id}-sel`).value;
    const p = key === 'custom' ? parsePlace($(`#${id}`).value) : PLACE[key];
    $(`#${id}-hint`).textContent = p ? `${toLocator(p.lat, p.lon)} - ${fmt(p.lat, 2)}°, ${fmt(p.lon, 2)}°` : 'Enter a locator (e.g. IN52pf) or lat, lon (e.g. 42.24, -8.72).';
    return p || null;
  }
  function placeChanged(id) {
    const key = $(`#${id}-sel`).value;
    $(`#${id}-sel`).closest('.field').nextElementSibling.hidden = key !== 'custom';
    const p = resolvePlace(id);
    if (id === 'p-obs' && p) { obs.lat = p.lat; obs.lon = p.lon; store('fn-observer', obs); }
    if (id === 'm-to') { prefs.to = key; prefs.toCustom = $('#m-to').value.trim(); store('fn-prop-prefs', prefs); }
  }

  let deb = null;
  view.addEventListener('input', e => {
    if (e.target.id === 'p-obs' || e.target.id === 'm-to') { placeChanged(e.target.id); clearTimeout(deb); deb = setTimeout(bandsAndPath, 250); }
  });
  view.addEventListener('change', e => {
    const id = e.target.id.replace(/-sel$/, '');
    if (id === 'p-obs' || id === 'm-to') { placeChanged(id); bandsAndPath(); }
    if (e.target.id === 'm-st') bandsAndPath();
  });
  resolvePlace('p-obs');
  bandsAndPath();
  const timer = setInterval(bandsAndPath, 5 * 60e3); // terminator and day/night move
  return () => { clearInterval(timer); clearTimeout(deb); };
});

/* ---------- glossary (plain-language explanations) ---------- */
const PROP_GLOSSARY = `
<section class="panel" id="prop-glossary" style="margin-top:16px">
  <div class="panel-head"><h2>Understanding this page</h2><span class="label">glossary</span></div>
  <div class="gloss-intro">
    <p><b>The short version.</b> Shortwave (HF, 3-30 MHz) signals can travel thousands of kilometres because they bounce off the <b>ionosphere</b>, layers of electrically charged gas between about 60 and 500 km up. The Sun creates those layers with its ultraviolet and X-ray light, so they are stronger by day, in summer and when the Sun is active. A layer only reflects signals below a certain frequency: above it, the signal escapes into space. Everything on this page is about two questions: how strong is the ionosphere right now, and is the Sun or the solar wind disturbing it?</p>
    <p><b>The rule of thumb.</b> High solar flux and quiet geomagnetic conditions (low Kp, Bz north) are good for HF. Solar flares (high X-rays) and geomagnetic storms (high Kp, Bz strongly south) are bad.</p>
  </div>

  <h3 class="gloss-h">The ionosphere</h3>
  <div class="table-wrap"><table class="gloss"><thead><tr><th>Term</th><th>What it means</th></tr></thead><tbody>
    <tr><td>Ionosphere</td><td>The part of the upper atmosphere where sunlight strips electrons off gas molecules. Those free electrons bend radio waves back to Earth.</td></tr>
    <tr><td>D layer</td><td>The lowest layer, about 60-90 km, only present in daylight. It does not reflect HF, it <b>absorbs</b> it, more so at lower frequencies. That is why 160 m and 80 m are poor for long distance during the day.</td></tr>
    <tr><td>E layer</td><td>About 90-150 km. Reflects lower HF frequencies by day. Occasionally dense patches called <b>sporadic E</b> reflect up to 50 MHz and beyond, mostly in summer.</td></tr>
    <tr><td>F2 layer</td><td>The highest and densest layer, about 200-400 km. It does most of the work for long distance HF, day and night.</td></tr>
    <tr><td>foF2</td><td><b>Critical frequency</b> of the F2 layer: the highest frequency reflected straight back down when you transmit vertically. Measured by ionosondes, in MHz. Higher foF2 means a denser layer and more bands open. Typically 3-5 MHz at night and 6-12 MHz by day.</td></tr>
    <tr><td>hmF2</td><td>Height of the densest part of the F2 layer, in km. It sets how far one bounce can reach: the higher the layer, the longer the hop.</td></tr>
    <tr><td>MUF</td><td><b>Maximum usable frequency</b> for a given path. A signal sent at a low angle hits the layer obliquely and is reflected at frequencies well above foF2, roughly foF2 × sec(angle) (the secant law). So the MUF grows with distance, up to about 3 to 4 times foF2 for one long hop.</td></tr>
    <tr><td>MUF(3000)F2</td><td>The MUF for a standard 3000 km hop, calculated by the ionosonde from its own measurement. A good number for long distance on one bounce.</td></tr>
    <tr><td>FOT</td><td><b>Frequency of optimum traffic</b>, about 0.85 × MUF. The MUF is a median: half the time it is lower. Working just below the FOT gives a reliable path.</td></tr>
    <tr><td>LUF</td><td><b>Lowest usable frequency</b>. Below it, D layer absorption and noise make the signal too weak. Not estimated on this page, but it is why low bands are poor by day.</td></tr>
    <tr><td>NVIS</td><td><b>Near vertical incidence skywave</b>: radiating almost straight up so the signal comes down within 0-400 km, filling the gap that ground wave cannot reach. Works only below foF2, which in practice means 80, 60 and 40 m.</td></tr>
    <tr><td>Skip zone</td><td>The ring between the end of the ground wave and the first sky wave landing, where a signal cannot be heard. It grows as the frequency gets closer to the MUF.</td></tr>
    <tr><td>Hop</td><td>One reflection off the ionosphere. A single F2 hop reaches roughly 3000-4000 km. Longer paths need several hops, each one losing some signal.</td></tr>
    <tr><td>Ionosonde</td><td>A radar that sweeps a signal straight up from about 1 to 20 MHz and times the echoes. The result, an <b>ionogram</b>, gives foF2, hmF2 and MUF(3000)F2. Most are read automatically (autoscaled), so occasional wrong values happen.</td></tr>
    <tr><td>Conf.</td><td>Confidence score of the automatic reading of the ionogram, 0 to 100. Below about 50, treat the values with caution.</td></tr>
    <tr><td>Grey line</td><td>The band around the Earth at sunrise and sunset. The D layer has faded on the night side while the F2 layer is still dense, so low band signals travelling along it suffer little absorption. Famous for long distance on 160, 80 and 40 m.</td></tr>
  </tbody></table></div>

  <h3 class="gloss-h">The Sun and space weather</h3>
  <div class="table-wrap"><table class="gloss"><thead><tr><th>Term</th><th>What it means</th></tr></thead><tbody>
    <tr><td>Solar flux F10.7</td><td>Radio noise from the Sun at 10.7 cm (2800 MHz), in solar flux units (sfu), measured daily in Penticton, Canada. It follows the Sun's ultraviolet output, which builds the ionosphere. Roughly: below 80 is poor, 80-120 fair, 120-200 good and above 200 excellent for the higher HF bands.</td></tr>
    <tr><td>90-day mean</td><td>The average F10.7 over three months. It shows where we are in the 11-year solar cycle better than a single day.</td></tr>
    <tr><td>Solar cycle</td><td>The Sun's activity rises and falls over about 11 years. Near solar maximum the upper bands (15, 12, 10 m) open often, near the minimum they are mostly closed.</td></tr>
    <tr><td>X-ray flux and flare class</td><td>X-ray brightness of the Sun measured by the GOES satellites, in W/m². Flares are classed A, B, C, M and X, each ten times stronger than the previous: C1 is 10<sup>-6</sup>, M1 is 10<sup>-5</sup> and X1 is 10<sup>-4</sup> W/m². The number is a multiplier, so M5 is five times M1.</td></tr>
    <tr><td>Radio blackout (R scale)</td><td>Strong flares (M and X) ionise the D layer within minutes and absorb HF on the side of the Earth facing the Sun. The lower bands go first. It lasts from minutes to a couple of hours. R1 (minor) is an M1 flare, R5 (extreme) an X20.</td></tr>
    <tr><td>Radiation storm (S scale)</td><td>Energetic protons from the Sun reach the polar regions and absorb HF there (polar cap absorption). Paths over the poles fail, others are mostly fine.</td></tr>
    <tr><td>Solar wind</td><td>A continuous stream of charged particles from the Sun, measured by spacecraft at the L1 point, 1.5 million km sunward, about 30-60 minutes before it reaches us. Typical speed 300-400 km/s. Above 500 km/s it is fast, often from a coronal hole, and tends to stir the magnetic field.</td></tr>
    <tr><td>Bt and Bz</td><td>The magnetic field carried by the solar wind (the IMF), in nanotesla (nT). <b>Bt</b> is its total strength. <b>Bz</b> is its north-south component. When Bz points south (negative) it connects with the Earth's field and lets energy in: a Bz of -10 nT or lower for hours often triggers a geomagnetic storm.</td></tr>
    <tr><td>Kp index</td><td>Global measure of how disturbed the Earth's magnetic field is, from 0 (quiet) to 9 (extreme storm), for each 3-hour interval. 0-2 is quiet and best for HF, 3-4 unsettled to active, 5 or more is a storm.</td></tr>
    <tr><td>Geomagnetic storm (G scale)</td><td>NOAA's scale for storms: G1 is Kp 5, up to G5 at Kp 9. During storms the F2 layer is depleted, MUFs drop for a day or two, high-latitude and polar paths fade and absorption rises. Aurora appears further south, and VHF operators can use it to bounce signals.</td></tr>
  </tbody></table></div>

  <h3 class="gloss-h">Reading the panels</h3>
  <div class="table-wrap"><table class="gloss"><thead><tr><th>Panel</th><th>How to read it</th></tr></thead><tbody>
    <tr><td>Space weather now</td><td>The three NOAA scales (✓ means quiet, ⚠ an event in progress) with today's probabilities, and the key numbers at a glance.</td></tr>
    <tr><td>Kp chart</td><td>Solid bars are measured, outlined bars are NOAA's estimate and 3-day forecast. The dashed line at 5 marks the storm threshold.</td></tr>
    <tr><td>X-ray chart</td><td>Logarithmic: each step up is a whole flare class, ten times stronger. Spikes above the dashed M1 line mean HF fade-outs on the daylight side.</td></tr>
    <tr><td>Solar wind charts</td><td>Watch for Bz staying below zero together with high speed: that is when storms start.</td></tr>
    <tr><td>Map</td><td>Each dot is an ionosonde with its foF2 in MHz, brighter for higher values. The yellow band is the grey line, darker areas are night. With a destination set, the path and its reflection points are drawn.</td></tr>
    <tr><td>HF bands now</td><td>A quick estimate from the ionosonde closest to you. NVIS is for nearby contacts (your region), DX for one long hop. It does not know about the LUF, your antenna or local noise, so a band marked open may still be quiet.</td></tr>
    <tr><td>Locations</td><td>Pick your location and the destination from the list (Galicia, Madrid and the European capitals), or choose Custom and type a <b>Maidenhead locator</b> or a latitude, longitude. A locator is the radio amateur way of giving a position: IN52pf, for example, is Vigo to within a few km. Your location is shared with the Satellites page.</td></tr>
  </tbody></table></div>
</section>`;

/* ============================================================
   WebSDR - RTL2832U over WebUSB (pending #3)
   Plan: WebUSB driver (RTL2832U + R820T2 tuner) -> Web Worker DSP
   (FFT, WFM/NFM/AM/SSB) -> AudioWorklet output.
   ============================================================ */
const RTL_FILTERS = [
  { vendorId: 0x0bda, productId: 0x2838 }, // RTL2838 (generic DVB-T dongles, RTL-SDR Blog)
  { vendorId: 0x0bda, productId: 0x2832 },
];

route('websdr', view => {
  document.title = 'WebSDR - frandomnoise';
  const hasUSB = 'usb' in navigator;
  view.innerHTML = `<div class="page-head"><span class="label">Receiver</span><h1>WebSDR</h1>
    <p>An RTL-SDR receiver that runs entirely in your browser: WebUSB driver, DSP in a Web Worker, audio through an AudioWorklet.</p></div>
    <div class="grid grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Device</h2><span class="label">${hasUSB ? 'WebUSB available' : 'no WebUSB'}</span></div>
        <p class="small muted">${hasUSB
          ? 'Requires a Chromium-based browser over HTTPS. On Linux, unload or blacklist <code>dvb_usb_rtl28xxu</code>. On Windows, install the WinUSB driver (e.g. with Zadig).'
          : 'This browser does not expose WebUSB. Use a recent Chrome, Edge or another Chromium-based browser on desktop or Android.'}</p>
        <button class="btn" id="connect" type="button" ${hasUSB ? '' : 'disabled'}>Connect RTL-SDR</button>
        <dl class="kv" id="dev" style="margin-top:12px"></dl>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Status</h2><span class="label">work in progress</span></div>
        <ul class="small">
          <li>RTL2832U + R820T2 WebUSB driver: <span class="draft-badge">pending</span></li>
          <li>Web Worker DSP (FFT, WFM/NFM/AM/SSB): <span class="draft-badge">pending</span></li>
          <li>AudioWorklet output: <span class="draft-badge">pending</span></li>
        </ul>
      </div>
    </div>`;
  if (!hasUSB) return;
  $('#connect').addEventListener('click', async () => {
    try {
      const d = await navigator.usb.requestDevice({ filters: RTL_FILTERS });
      $('#dev').innerHTML = [
        ['Product', d.productName || '-'], ['Manufacturer', d.manufacturerName || '-'],
        ['VID:PID', `${d.vendorId.toString(16).padStart(4, '0')}:${d.productId.toString(16).padStart(4, '0')}`],
        ['Serial', d.serialNumber || '-'],
      ].map(([k, v]) => `<dt>${k}</dt><dd>${h(v)}</dd>`).join('');
    } catch (e) {
      if (e.name !== 'NotFoundError') $('#dev').innerHTML = `<dt>Error</dt><dd>${h(e.message)}</dd>`;
    }
  });
});

navigate();
